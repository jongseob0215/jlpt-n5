  /* ---------- 단어 ---------- */
  function vWords() {
    const seen = Object.keys(A.S.words).length; const learned = A.learnedCount(); const total = A.WORDS.length;
    return `
      <h1 class="title">단어</h1>
      <section class="panel">
        <div class="meter">
          <div class="meter-top"><span>익힌 단어</span><span class="num">${learned} / ${total}</span></div>
          <div class="track"><i style="width:${pct(learned, total)}%"></i></div>
          <div class="meter-note">지금까지 ${seen}개를 봤어요. 3단계 이상이 된 단어를 익힌 단어로 세요.</div>
        </div>
      </section>
      <section class="panel">
        <h2>카드 학습</h2>
        <p class="muted small">10장씩 넘겨요. 틀렸던 단어, 오늘 복습할 단어, 새 단어 순서로 나와요. 카드를 왼쪽으로 밀면 "알아요", 오른쪽으로 밀면 "모름"이에요. "알아요"로 넘긴 단어는 1·3·7·14·30일 간격으로 다시 나와요.</p>
        <button class="btn primary wide" data-act="start-cards">카드 10장 시작</button>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>주제별로 공부하기</h2><button type="button" class="btn sm" data-act="go-dict">단어 목록</button></div>
        <p class="muted small">주제를 누르면 그 주제 단어로만 카드 10장을 넘겨요. 숫자는 본 단어 수예요.</p>
        <div class="topics">${topicTiles()}</div>
      </section>
      <button type="button" class="link-row" data-kana="open"><span class="lr-ico jp" aria-hidden="true">あア</span><span class="lr-main"><b>히라가나·가타카나 표</b><span class="muted small">헷갈리는 글자는 표에서 바로 확인해요</span></span><span aria-hidden="true">›</span></button>
      <section class="panel">
        <h2>단어 테스트</h2>
        <p class="muted small">4지선다 10문제예요. 일본어→한국어와 한국어→일본어가 번갈아 나오고, 오늘 본 단어가 먼저 나와요.</p>
        <button class="btn wide" data-act="start-test">테스트 10문제 시작</button>
      </section>`;
  }
  function topicStats() {
    const st = {};
    for (const w of A.WORDS) { const s = st[w.topic] || (st[w.topic] = { n: 0, seen: 0, learned: 0 }); s.n++; const p = A.S.words[w.id]; if (p) { s.seen++; if (p.b >= 3) s.learned++; } }
    return st;
  }
  function topicTiles() {
    const st = topicStats();
    return A.TOPICS.filter(([k]) => st[k]).map(([k, l]) => { const s = st[k]; const done = s.seen >= s.n; return `<button type="button" class="topic${done ? ' done' : ''}" data-act="start-topic" data-t="${k}"><b>${done ? '✓ ' : ''}${l}</b><span class="num small">${s.seen} / ${s.n}</span><span class="track thin"><i style="width:${pct(s.seen, s.n)}%"></i></span></button>`; }).join('');
  }
  let dictTopic = 'all';
  let dictQuery = '';
  function dictRows() {
    const q = dictQuery.trim().toLowerCase();
    const list = A.WORDS.filter((w) => (dictTopic === 'all' || w.topic === dictTopic) && (!q || w.w.toLowerCase().includes(q) || w.r.includes(q) || w.m.toLowerCase().includes(q)));
    if (!list.length) return '<li class="muted">찾는 단어가 없어요.</li>';
    return list.map((w) => { const p = A.S.words[w.id]; return `<li><div class="li-main">${jp(w.w)}${w.r !== w.w ? ` <span class="muted">${esc(w.r)}</span>` : ''}<br><span class="small">${esc(w.m)}</span> <span class="tag">${A.POS[w.p] || ''}</span></div><span class="small muted num">${p ? `${p.b}단계` : '새 단어'}</span>${canSpeak && jaReady() ? `<button type="button" class="say" data-act="speak" data-say="${esc(w.r)}" aria-label="${esc(w.w)} 발음 듣기">▶</button>` : ''}</li>`; }).join('');
  }
  function vDict() {
    const st = topicStats();
    const chips = [['all', '전체']].concat(A.TOPICS.filter(([k]) => st[k])).map(([k, l]) => `<button type="button" class="chip-btn${dictTopic === k ? ' on' : ''}" data-act="dict-topic" data-t="${k}" aria-pressed="${dictTopic === k}">${dictTopic === k ? '● ' : ''}${l}</button>`).join('');
    return `<h1 class="title">단어 목록</h1>
      <p class="muted small">N5 단어 ${A.WORDS.length}개예요. 일본어, 읽기, 뜻으로 찾을 수 있어요.</p>
      <input id="dict-q" class="search" type="search" placeholder="예) がっこう, 학교" value="${esc(dictQuery)}" aria-label="단어 찾기" autocomplete="off">
      <div class="chips">${chips}</div>
      ${dictTopic !== 'all' ? `<button class="btn primary wide" data-act="start-topic" data-t="${dictTopic}">${A.TOPIC_NAME[dictTopic]} 카드 10장</button>` : ''}
      <section class="panel"><ul class="notes dict" id="dict-list">${dictRows()}</ul></section>`;
  }
  function vCards() {
    const id = X.ids[X.i]; const w = A.WMAP.get(id); const p = A.S.words[id];
    const stage = p ? `${p.b}단계` : '새 단어';
    const anim = X.anim; X.anim = null;
    const back = X.flip ? `
          <div class="card-back">
            ${w.r !== w.w ? `<div class="reading jp">${esc(w.r)}</div>` : ''}
            <div class="meaning">${esc(w.m)}</div>
            <div class="example"><div class="jp">${esc(w.ex)}</div><div class="muted">${esc(w.exk)}</div></div>
            ${w.note ? `<div class="note">${esc(w.note)}</div>` : ''}
          </div>` : '<div class="hint">눌러서 뜻 보기</div>';
    const actions = X.flip
      ? `<div class="row2"><button class="btn primary" data-act="card-yes">○ 알아요</button><button class="btn" data-act="card-no">× 모름</button></div>
         <div class="say-row">${sayBtn(w.r, '단어')}${canSpeak && jaReady() ? `<button type="button" class="say" data-act="speak" data-say="${esc(w.ex)}" aria-label="예문 발음 듣기">▶ 예문</button>` : ''}</div>`
      : `<button class="btn wide" data-act="flip">뜻 보기</button>`;
    return `${progress(X.i, X.ids.length, X.topic ? `카드 · ${A.TOPIC_NAME[X.topic]}` : '카드 학습')}
      <div class="card-stage${X.i + 1 < X.ids.length ? ' has-next' : ''}">
        <div class="card${anim ? ' ' + anim : ''}" role="button" tabindex="0" data-act="flip" data-swipe aria-label="카드 뒤집기">
          <span class="stamp know" aria-hidden="true">○ 알아요</span>
          <span class="stamp dont" aria-hidden="true">× 모름</span>
          <div class="card-meta"><span>${A.POS[w.p]}</span><span>${stage}</span></div>
          <div class="word jp">${esc(w.w)}</div>
          ${back}
        </div>
      </div>
      <p class="swipe-hint" aria-hidden="true"><b>← ○ 알아요</b><span>밀어서 넘기기</span><b>× 모름 →</b></p>
      ${actions}`;
  }
  function vCardsDone() {
    return `<section class="panel center">
        <div class="done-mark sm" aria-hidden="true">✓</div>
        <h2>카드 ${X.ids.length}장 끝!</h2>
        <p class="num">○ 알아요 ${X.k} · × 모름 ${X.u}</p>
        <p class="xp-earned num">+${X.xp || 0} XP</p>
        <p class="muted small">${X.u ? '모름으로 넘긴 단어는 오답노트에 모아 뒀어요.' : '모두 알고 있었네요. 대단해요!'}</p>
        <div class="stack">
          <button class="btn primary wide" data-act="start-test">이 단어들로 테스트</button>
          <button class="btn wide" data-act="more-cards">카드 10장 더</button>
          <button class="btn ghost wide" data-tab="home">홈으로</button>
        </div>
      </section>`;
  }
  function vTest() {
    const it = X.items[X.i]; const w = A.WMAP.get(it.id); const answered = it.picked !== null;
    const fx = it.fx; it.fx = false;
    const ok = answered && it.opts[it.picked] === it.ans;
    const prompt = it.dir === 'jk'
      ? `<p class="prompt">이 단어의 뜻은?</p><div class="word jp">${esc(w.w)}</div>`
      : `<p class="prompt">이 뜻의 일본어는?</p><div class="word ko">${esc(w.m)}</div>`;
    const opts = it.opts.map((o, k) => {
      let cls = 'opt', mark = '';
      if (answered) {
        if (o === it.ans) { cls += ' right' + (fx && ok ? ' pop' : ''); mark = '<span class="mark">○ 정답</span>'; }
        else if (k === it.picked) { cls += ' wrong' + (fx ? ' shake' : ''); mark = '<span class="mark">× 내 답</span>'; }
        else cls += ' dim';
      }
      return `<button class="${cls}" data-act="test-pick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="no">${NUM[k]}</span><span class="${it.dir === 'kj' ? 'jp' : ''}">${esc(o)}</span>${mark}</button>`;
    }).join('');
    const fb = answered ? `<div class="feedback">${jp(w.w)}${w.r !== w.w ? ` (${jp(w.r)})` : ''} · ${esc(w.m)} ${sayBtn(w.r, '단어')}${fx ? xpPop(it.xp) : ''}</div>
      <button class="btn primary wide" data-act="test-next">${X.i + 1 < X.items.length ? '다음' : '결과 보기'}</button>
      ${X.i === 0 ? '<p class="swipe-tip">화면을 왼쪽으로 밀어도 넘어가요</p>' : ''}` : '';
    return `${progress(X.i, X.items.length, X.retry ? '단어 오답 다시 풀기' : '단어 테스트', comboChip(X.combo, fx && ok))}${prompt}<div class="opts">${opts}</div>${fb}`;
  }
  function vTestDone() {
    const rows = X.items.map((it) => { const w = A.WMAP.get(it.id); const ok = it.opts[it.picked] === it.ans; return `<li><span class="okmark">${ok ? '○' : '×'}</span>${jp(w.w)} <span class="muted">${w.r !== w.w ? esc(w.r) + ' · ' : ''}${esc(w.m)}</span></li>`; }).join('');
    return `<section class="panel">
        <h2>${X.retry ? '오답 다시 풀기' : '단어 테스트'} 결과</h2>
        <p class="score num">${X.c} / ${X.items.length}</p>
        <p class="xp-earned num">+${X.xp || 0} XP${X.best >= 3 ? ` · 최고 콤보 ${X.best}` : ''}</p>
        <ul class="result-list">${rows}</ul>
        <p class="muted small">${X.retry ? '맞힌 단어는 오답노트에서 지웠어요.' : '틀린 단어는 오답노트에 모아 뒀어요.'}</p>
        <div class="stack">
          <button class="btn primary wide" data-act="${X.retry ? 'retry-words' : 'start-test'}">${X.retry ? '남은 오답 다시 풀기' : '테스트 10문제 더'}</button>
          <button class="btn ghost wide" data-tab="${X.from === 'notes' ? 'notes' : 'home'}">${X.from === 'notes' ? '오답노트로' : '홈으로'}</button>
        </div>
      </section>`;
  }

  /* ---------- 문제 ---------- */
  function vQuiz() {
    const S = A.S;
    const types = ['all', 'kr', 'pk', 'cx', 'pa', 'gr', 'so', 'bp', 'rd', 'ls'];
    const chips = types.map((t) => {
      const n = A.QS.filter((q) => A.inType(q, t) && A.isOpenQ(q)).length;
      return `<button class="chip-btn${quizType === t ? ' on' : ''}" data-act="qtype" data-t="${t}" aria-pressed="${quizType === t}">${quizType === t ? '● ' : ''}${t === 'all' ? '전체' : A.QT[t]} <span class="num">${n}</span></button>`;
    }).join('');
    const acc = ['kr', 'pk', 'cx', 'pa', 'gr', 'so', 'bp', 'rd', 'ls'].map((t) => {
      let n = 0, c = 0;
      for (const q of A.QS) if (A.inType(q, t) && S.qs[q.id]) { n += S.qs[q.id].n; c += S.qs[q.id].c; }
      return `<li><span>${A.QT[t]}</span><span class="num">${n ? pct(c, n) + '%' : '-'}</span><span class="muted num">${n}회</span></li>`;
    }).join('');
    const mock = S.run
      ? `<p><b>${S.run.kind === 'full' ? '실전' : '미니'} 모의고사 푸는 중</b> · ${S.run.brk ? '쉬는 시간' : `남은 시간 <span class="run-left num">${mmss(S.run.deadline - Date.now())}</span>`}</p><button class="btn primary wide" data-act="resume-mock">이어서 풀기</button>`
      : `<button class="btn primary wide" data-act="go-mocklist">회차별 실전 모의고사 (${A.MOCK_SETS.length}회 · 회차당 67문항 · 90분)</button><button class="btn wide" data-act="start-mock" data-kind="full">무작위 실전 모의고사</button><button class="btn wide" data-act="start-mock" data-kind="mini">미니 모의고사 (문자·어휘 · 21문항 · 20분)</button>`;
    const last = S.mocks.length ? `<button class="btn ghost wide" data-act="show-last-mock">지난 결과 보기 · <span class="num">${S.mocks[0].c} / ${S.mocks[0].n}</span></button>` : '';
    return `
      <h1 class="title">문제</h1>
      <section class="panel">
        <h2>모의고사</h2>
        <p class="muted small">실전 모의고사는 JLPT N5와 같은 구성이에요. 1교시 문자·어휘 20분, 2교시 문법·독해 40분, 3교시 청해 30분이고, 교시를 제출하면 쉬는 시간 뒤에 다음 교시를 시작해요. 미니 모의고사는 1교시만 풀어요. 결과는 정답 수라서 실제 시험의 척도 점수와는 달라요.</p>
        ${mock}${last}
      </section>

  function passageHtml(q) {

  /* ---------- 청해: 기기 음성으로 대화를 읽는다 ---------- */
  let lsToken = 0; let lsPlaying = false; let lsSlow = false;

  const jaVoices = () => { try { return window.speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang)); } catch (e) { return []; } };
  /* 음성 목록을 아직 못 받았으면 쓸 수 있다고 보고, 받았는데 일본어 음성이 없으면 대본을 보여 준다 */
  const jaReady = () => { if (!canSpeak) return false; try { const all = window.speechSynthesis.getVoices(); return !all.length || all.some((v) => /^ja/i.test(v.lang)); } catch (e) { return false; } };
  if (canSpeak && typeof window.speechSynthesis.addEventListener === 'function') window.speechSynthesis.addEventListener('voiceschanged', () => { if (currentListen() && !lsPlaying) render(true); });
  function voiceFor(role) {
    const vs = jaVoices(); if (!vs.length) return null;
    const male = vs.find((v) => /otoya|ichiro|keita|hattori|daichi|naoki|male|男性/i.test(v.name) && !/female|女性/i.test(v.name));
    const female = vs.find((v) => /kyoko|haruka|ayumi|nanami|mizuki|sayaka|o-ren|female|女性/i.test(v.name)) || vs.find((v) => v !== male) || vs[0];
    return role === 'M' ? (male || female) : female;
  }
  function scriptLines(q, opts) {
    if (q.t === 'lt' || q.t === 'lp') return [['N', q.set + q.ask]].concat(q.s, [['N', q.ask]]);
    const o = opts || q.o;
    if (q.t === 'le') return [['N', q.say]].concat(o.map((x, k) => [q.v || 'F', `${k + 1}、${x}`]));
    if (q.t === 'lr') { const other = q.sp === 'M' ? 'F' : 'M'; return [[q.sp, q.line]].concat(o.map((x, k) => [other, `${k + 1}、${x}`])); }

  }
  function setPlayBtn() { const b = document.getElementById('l-play'); if (b) b.textContent = lsPlaying ? '■ 멈추기' : '▶ 듣기'; }

  function playLines(lines) {
    if (!jaReady() || !lines.length) return;
    const token = ++lsToken;
    try {
      window.speechSynthesis.cancel();
      const vm = voiceFor('M'); const vf = voiceFor('F'); const sameVoice = !vm || vm === vf;
      lines.forEach(([role, text], i) => {
        const u = new window.SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.rate = lsSlow ? 0.7 : 0.95;

  function currentListen() {

    if (view === 'mock' && A.S.run && !A.S.run.brk) { const run = A.S.run; const id = run.ids[run.i]; const q = A.QMAP.get(id); if (q && A.LISTEN.has(q.t)) return { q, opts: run.opts[id], it: null }; }

  function playCurrent() { const c = currentListen(); if (c) playLines(scriptLines(c.q, c.opts)); }
