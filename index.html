<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N5 학습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<title>JLPT N5 학습장</title>
<script>try { var t = localStorage.getItem('jlpt-n5-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* 저장소를 못 쓰는 환경 */ }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* 한 화면 앱: 위 머리말, 가운데 스크롤 영역, 아래 탭. 단어 카드는 원고지 칸 무늬.
   정오·상태는 색만 쓰지 않고 ○/× 기호, 테두리 굵기와 실선·점선, 명암을 함께 쓴다(색약 배려).
   움직임은 prefers-reduced-motion: no-preference일 때만 켠다. */
:root {
  --bg: #f6f2ea;
  --surface: #fffdf8;
  --ink: #1e2230;
  --ink-2: #4a5061;
  --muted: #686c79;
  --line: #e4ddcf;
  --grid: #f1ebdf;
  --accent: #3f4fc4;
  --accent-soft: #e8eafb;
  --on-accent: #ffffff;
  --soft: #ebe5d8;
  --tone-3: #4a5468;
  --warm: #e2a23b;
  --shadow-sm: 0 1px 2px rgba(64, 48, 24, 0.06);
  --shadow: 0 1px 2px rgba(64, 48, 24, 0.05), 0 12px 30px -14px rgba(64, 48, 24, 0.22);
  --shadow-accent: 0 10px 24px -12px rgba(63, 79, 196, 0.6);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-jp: "Klee One", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121419; --surface: #1c1f27; --ink: #eceef3; --ink-2: #b8bdca; --muted: #979dab;
    --line: #2e333e; --grid: #23272f; --accent: #a3adff; --accent-soft: #272c48; --on-accent: #12141a;
    --soft: #2b303b; --tone-3: #c3cad6; --warm: #e8b25a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    --shadow-accent: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121419; --surface: #1c1f27; --ink: #eceef3; --ink-2: #b8bdca; --muted: #979dab;
  --line: #2e333e; --grid: #23272f; --accent: #a3adff; --accent-soft: #272c48; --on-accent: #12141a;
  --soft: #2b303b; --tone-3: #c3cad6; --warm: #e8b25a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  --shadow-accent: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.logo { width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 17px; line-height: 1; box-shadow: var(--shadow-accent); }
.hdr-right { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.hdr-right .dd { font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; }
.hdr-right .sync { color: var(--muted); }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.icon-btn:active { transform: scale(0.9); }
.icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pill-btn { height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.pill-btn:active { transform: scale(0.94); }
.pill-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 8px 16px 28px; touch-action: pan-y; touch-action: pan-y pinch-zoom; }
#view { display: flex; flex-direction: column; gap: 14px; }
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.tabs button { background: none; border: 0; padding: 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
nav.tabs .ico { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background-color 0.2s ease; }
nav.tabs button.on { color: var(--ink); font-weight: 700; }
nav.tabs button.on .ico { background: var(--accent-soft); color: var(--accent); }

h1.title { font-size: 1.5rem; margin: 4px 0 0; letter-spacing: -0.01em; }
h2 { font-size: 1.0625rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.jp { font-family: var(--f-jp); font-weight: 600; }
.center { text-align: center; }

.hero { position: relative; overflow: hidden; background: var(--accent); color: var(--on-accent); border-radius: 24px; padding: 16px 20px 18px; box-shadow: var(--shadow-accent); }
.hero::after { content: "合格"; position: absolute; right: -4px; bottom: -30px; font-family: var(--f-jp); font-weight: 600; font-size: 96px; line-height: 1; opacity: 0.13; pointer-events: none; }
.hello { font-size: 14px; }
.hello .jp { margin-right: 8px; }
.dday { font-size: 3rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; }
.exam { font-size: 13px; margin-top: 4px; opacity: 0.92; }
.hero-link { position: relative; z-index: 1; margin-top: 10px; background: rgba(255, 255, 255, 0.18); color: inherit; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
:root[data-theme="dark"] .hero-link { background: rgba(0, 0, 0, 0.12); border-color: rgba(0, 0, 0, 0.35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero-link { background: rgba(0, 0, 0, 0.12); border-color: rgba(0, 0, 0, 0.35); } }
.links { display: flex; flex-direction: column; gap: 8px; }
.link-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.link-row:active { transform: scale(0.98); }
.link-row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lr-ico { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.exam-part { display: flex; flex-direction: column; gap: 4px; }
.ep-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ext { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); text-decoration: none; background: var(--surface); font-weight: 500; }
.ext:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow-sm); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--surface); }
.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 2px solid var(--ink); border-radius: 18px; padding: 12px 14px; background: var(--surface); }

.meter { display: flex; flex-direction: column; gap: 5px; }
.meter-top { display: flex; justify-content: space-between; font-weight: 500; }
.meter-note { font-size: 13px; color: var(--muted); }
.meter-note b { color: var(--ink); }
.track { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.track.thin { height: 6px; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 13px 16px; font-weight: 700; cursor: pointer; text-align: center; box-shadow: var(--shadow-sm); transition: transform 0.12s ease, background-color 0.15s ease; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); font-weight: 500; box-shadow: none; }
.btn.danger { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.btn.sm { padding: 7px 13px; font-size: 13px; border-radius: 12px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.btn:focus-visible, .opt:focus-visible, .card:focus-visible, nav.tabs button:focus-visible, .chip-btn:focus-visible, .fact:focus-visible, .gnum:focus-visible, .del:focus-visible, .say:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 12px; color: var(--ink-2); cursor: pointer; text-align: left; min-width: 0; box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.fact:active { transform: scale(0.96); }
.fact .big { font-size: 1.375rem; font-weight: 700; color: var(--ink); }

.sess-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.card-stage { position: relative; perspective: 1100px; }
.card-stage.has-next::before { content: ""; position: absolute; left: 14px; right: 14px; top: 12px; bottom: -9px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.card {
  position: relative; min-height: 320px; border: 1px solid var(--line); border-radius: 24px; padding: 18px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: center;
  box-shadow: var(--shadow); touch-action: pan-y; touch-action: pan-y pinch-zoom; user-select: none; -webkit-user-select: none; backface-visibility: hidden;
}
.card.dragging { cursor: grabbing; transition: none; }
.card-meta { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.stamp { position: absolute; top: 40px; z-index: 1; padding: 2px 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 1.125rem; pointer-events: none; transition: opacity 0.15s ease; }
.stamp.know { right: 16px; transform: rotate(8deg); opacity: var(--know, 0); }
.stamp.dont { left: 16px; transform: rotate(-8deg); opacity: var(--dont, 0); border-style: dashed; }
.card.dragging .stamp { transition: none; }
.word { font-family: var(--f-jp); font-weight: 600; font-size: 3rem; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
.word.ko { font-family: var(--f-ui); font-size: 1.75rem; font-weight: 700; text-align: center; }
.card-back { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.reading { font-size: 1.375rem; }
.meaning { font-size: 1.25rem; font-weight: 700; }
.example { background: var(--surface); border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.example .jp { font-size: 1.0625rem; }
.note { font-size: 13px; border: 1px solid var(--line); border-radius: 10px; padding: 3px 9px; background: var(--surface); }
.hint { font-size: 13px; color: var(--muted); }
.swipe-hint { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 6px 0; }
.swipe-hint b { color: var(--ink-2); font-weight: 700; }
.swipe-tip { text-align: center; font-size: 12px; color: var(--muted); }
.say-row { display: flex; gap: 8px; justify-content: center; }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; box-shadow: var(--shadow-sm); }

.prompt { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.qtext { font-size: 1.375rem; line-height: 1.7; }
.qtext u, .stem u { text-decoration-thickness: 2px; text-underline-offset: 5px; }
.stem { font-size: 1.25rem; line-height: 1.7; border: 1.5px solid var(--ink-2); border-radius: 14px; padding: 10px 12px; background: var(--surface); }
.blank { letter-spacing: 0.1em; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; cursor: pointer; font-size: 1.0625rem; min-width: 0; box-shadow: var(--shadow-sm); transition: transform 0.12s ease; }
.opt:active:not(:disabled) { transform: scale(0.985); }
.opt .jp { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt > span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .no { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; font-family: var(--f-ui); }
.opt .mark { flex: none; font-size: 12px; font-weight: 700; white-space: nowrap; }
.opt.picked { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--accent-soft); }
.opt.picked .no { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt.right { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--soft); }
.opt.right .no { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt.wrong { border: 2px dashed var(--ink); box-shadow: none; }
.opt.dim { opacity: 0.5; box-shadow: none; }
.opt:disabled { cursor: default; color: var(--ink); }
.feedback { font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.explain { border-left: 4px solid var(--ink); padding: 6px 0 6px 12px; display: flex; flex-direction: column; gap: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip-btn.on { border: 2px solid var(--ink); background: var(--accent-soft); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg .chip-btn { padding: 8px 4px; border-radius: 12px; text-align: center; }
.acc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.acc li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: center; }
.acc.mocks li { grid-template-columns: 1fr auto auto auto; }
.acc li:last-child { border-bottom: 0; }
.score { font-size: 2.25rem; font-weight: 700; line-height: 1.2; }
.result-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.result-list li { display: flex; gap: 8px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.okmark { flex: none; width: 18px; font-weight: 700; }

.mock-bar { display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 9px 16px; font-weight: 700; position: sticky; top: 0; z-index: 2; box-shadow: var(--shadow); }
.timer { font-size: 1.25rem; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.gnum { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.gnum.has { background: var(--tone-3); color: var(--bg); border-color: var(--tone-3); font-weight: 700; }
.gnum.cur { outline: 3px solid var(--ink); outline-offset: 1px; }
.confirm { border: 2px solid var(--ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
details.ritem { border-bottom: 1px solid var(--line); padding: 8px 0; }
details.ritem:last-child { border-bottom: 0; }
details.ritem summary { cursor: pointer; display: flex; gap: 6px; align-items: baseline; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
details.ritem[open] { display: flex; flex-direction: column; gap: 6px; }
details.ritem[open] > :not(summary) { margin-left: 24px; }

.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.notes li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.notes li:last-child { border-bottom: 0; }
.li-main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cnt { font-weight: 700; }
.tag { font-size: 11px; border: 1px solid var(--ink-2); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.del { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 12px; padding: 4px 9px; cursor: pointer; flex: none; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: var(--shadow-sm); }
.tile b { font-size: 1.0625rem; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.lg-w { background: var(--tone-3); }
.lg-q { border: 1.5px solid var(--ink-2); background: repeating-linear-gradient(45deg, var(--ink-2) 0 2px, var(--surface) 2px 4px); }
svg.chart { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .b-w { fill: var(--tone-3); }
.chart .b-q { fill: url(#hatch); stroke: var(--ink-2); stroke-width: 1.2; }
.chart .hatch-bg { fill: var(--surface); }
.chart .hatch-ln { fill: var(--ink-2); }
.chart .hit { fill: transparent; }
.chart text { fill: var(--ink-2); font-size: 10px; text-anchor: middle; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.chart text.lab { font-size: 11px; fill: var(--muted); }
.chart text.lab.today { fill: var(--ink); font-weight: 700; }
.form { display: flex; flex-direction: column; gap: 6px; }
.form label { font-size: 13px; font-weight: 500; margin-top: 4px; }
.form input { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; }

  {id:"cx05",t:"cx",q:"毎朝 六時に （　）、シャワーを あびます。",o:["おきて","ねて","はいって","つかれて"],e:"아침에 일어나서(おきて) 샤워를 합니다. ねて는 '자고'입니다."},
  {id:"cx06",t:"cx",q:"きのうは 頭が （　）、学校を 休みました。",o:["いたくて","おおきくて","ながくて","あかくて"],e:"머리가 아파서(いたくて) 학교를 쉬었습니다. い형용사의 て형(~くて)이 이유를 나타냅니다."},
  {id:"cx07",t:"cx",q:"新しい くつを 1（　） 買いました。",o:["そく","まい","ほん","だい"],e:"신발·양말은 そく(足)로 셉니다. 1そく는 いっそく로 읽습니다. まい(枚)는 종이·셔츠, ほん(本)은 연필·병, だい(台)는 차·기계를 셉니다."},
  {id:"cx08",t:"cx",q:"図書館で 本を 3（　） 借りました。",o:["さつ","まい","だい","ひき"],e:"책은 さつ(冊)로 셉니다. 3さつ는 さんさつ입니다. ひき(匹)는 작은 동물을 셉니다."},
  {id:"cx09",t:"cx",q:"教室に 学生が 5（　） います。",o:["にん","ほん","まい","だい"],e:"사람은 にん(人)으로 셉니다. 1명 ひとり, 2명 ふたり만 예외입니다."},
  {id:"cx10",t:"cx",q:"家の 前に 車が 2（　） あります。",o:["だい","にん","さつ","ひき"],e:"차·자전거 같은 기계는 だい(台)로 셉니다."},
  {id:"cx11",t:"cx",q:"わたしの 部屋は とても （　）です。ベッドと 机しか ありません。",o:["せまい","ひろい","おおい","たかい"],e:"침대와 책상밖에 없을 만큼 좁다(せまい)는 뜻입니다."},
  {id:"cx12",t:"cx",q:"雨が 降って いますから、（　）を 持って 行きます。",o:["かさ","とけい","しんぶん","きって"],e:"비가 오니까 우산(かさ)을 가져갑니다."},
  {id:"cx13",t:"cx",q:"この 店の パンは 安くて （　）です。",o:["おいしい","いたい","ひくい","わかい"],e:"싸고 맛있다(おいしい)가 자연스럽습니다. ひくい는 '낮다', わかい는 '젊다'입니다."},
  {id:"cx14",t:"cx",q:"銀行は 九時に （　）。",o:["あきます","あけます","はいります","でます"],e:"은행'이' 열리다는 자동사 あきます(開く)입니다. あけます(開ける)는 '~을 열다'라서 앞에 を가 필요합니다."},
  {id:"cx15",t:"cx",q:"兄は めがねを （　） います。",o:["かけて","きて","はいて","かぶって"],e:"안경은 かける를 씁니다. 셔츠는 きる, 바지·신발은 はく, 모자는 かぶる입니다."},

  {id:"pa01",t:"pa",q:"この 部屋は くらいです。",o:["この 部屋は あかるくないです。","この 部屋は あかるいです。","この 部屋は せまくないです。","この 部屋は しずかです。"],e:"くらい(어둡다)는 あかるくない(밝지 않다)와 뜻이 같습니다."},
  {id:"pa02",t:"pa",q:"わたしは さかなが きらいです。",o:["わたしは さかなが すきじゃ ありません。","わたしは さかなを よく たべます。","わたしは さかなが すきです。","わたしは さかなが じょうずです。"],e:"きらい(싫어함)는 すきじゃ ありません(좋아하지 않습니다)과 가깝습니다."},
  {id:"pa03",t:"pa",q:"おととい びょういんへ 行きました。",o:["ふつか まえに びょういんへ 行きました。","きのう びょういんへ 行きました。","ふつか あとに びょういんへ 行きます。","きょう びょういんへ 行きました。"],e:"おととい(그저께)는 ふつか まえ(이틀 전)입니다."},
  {id:"pa04",t:"pa",q:"この もんだいは やさしいです。",o:["この もんだいは むずかしくないです。","この もんだいは むずかしいです。","この もんだいは ながいです。","この もんだいは おもしろいです。"],e:"やさしい(쉽다)는 むずかしくない(어렵지 않다)와 같습니다."},
  {id:"pa05",t:"pa",q:"ちちは いま でかけて います。",o:["ちちは いま いえに いません。","ちちは いま いえに います。","ちちは いま ねて います。","ちちは いま ごはんを たべて います。"],e:"でかけて いる(외출해 있다)는 いえに いない(집에 없다)와 같습니다."},
  {id:"pa06",t:"pa",q:"きょうしつに だれも いません。",o:["きょうしつに ひとが ひとりも いません。","きょうしつに ひとが たくさん います。","きょうしつに せんせいだけ います。","きょうしつに がくせいが ふたり います。"],e:"だれも + 부정은 '아무도 없다'입니다. ひとりも + 부정과 같은 뜻입니다."},
  {id:"pa07",t:"pa",q:"この みせは いつも ひとが おおいです。",o:["この みせは いつも にぎやかです。","この みせは いつも しずかです。","この みせは いつも やすいです。","この みせは いつも ちかいです。"],e:"사람이 많다는 にぎやか(북적이다)와 가깝습니다."},
  {id:"pa08",t:"pa",q:"しゅくだいは もう おわりました。",o:["しゅくだいは もう しました。","しゅくだいは まだ して いません。","しゅくだいは これから します。","しゅくだいは ぜんぜん しません。"],e:"もう おわりました(벌써 끝났습니다)는 もう しました(벌써 했습니다)와 같습니다."},

  {id:"gr01",t:"gr",q:"わたし（　） 学生です。",o:["は","を","に","で"],e:"'A는 B입니다'의 주제는 は로 나타냅니다."},
  {id:"gr02",t:"gr",q:"毎朝 パン（　） 食べます。",o:["を","が","に","へ"],e:"동작의 대상(목적어)은 を입니다."},
  {id:"gr03",t:"gr",q:"駅（　） 友だちに 会います。",o:["で","に","を","が"],e:"동작이 일어나는 장소는 で입니다. '~를 만나다'는 「~に 会う」입니다."},
  {id:"gr04",t:"gr",q:"机の 上（　） 猫が います。",o:["に","で","を","へ"],e:"존재하는 장소(います·あります)는 に입니다."},
  {id:"gr05",t:"gr",q:"バス（　） 乗って 学校へ 行きます。",o:["に","を","で","が"],e:"乗る는 「~に 乗る」입니다. 우리말 '~을 타다'와 조사가 다르니 주의하세요."},
  {id:"gr06",t:"gr",q:"わたしは 日本語（　） 少し わかります。",o:["が","を","に","で"],e:"わかる는 「~が わかる」로 씁니다."},
  {id:"gr07",t:"gr",q:"きのうの テストは （　）。",o:["むずかしかったです","むずかしいでした","むずかしだったです","むずかしいかったです"],e:"い형용사 과거 정중형은 い를 빼고 かったです를 붙입니다. 「~いでした」는 틀린 형태입니다."},
  {id:"gr08",t:"gr",q:"きのうは （　）でした。",o:["ひま","ひまい","ひまだ","ひまく"],e:"な형용사 과거 정중형은 어간에 でした를 붙입니다: ひまでした."},
  {id:"gr09",t:"gr",q:"この ケーキは （　） おいしくないです。",o:["あまり","とても","よく","たくさん"],e:"あまり는 뒤에 부정이 와서 '그다지 ~않다'가 됩니다. とても는 긍정과 함께 씁니다."},
  {id:"gr10",t:"gr",q:"いっしょに 映画を （　）。",o:["見ませんか","見ますか","見ましたか","見て いますか"],e:"함께하자고 권할 때는 「~ませんか」(~하지 않겠습니까?)를 씁니다."},
  {id:"gr11",t:"gr",q:"窓を （　） ください。",o:["あけて","あけって","あいて","あけ"],e:"2그룹 동사 あける는 る를 떼고 て를 붙입니다: あけて. あいて는 開く(열리다)의 て형입니다."},
  {id:"gr12",t:"gr",q:"手紙を （　） います。",o:["書いて","書きて","書って","書いって"],e:"く로 끝나는 1그룹 동사는 いて가 됩니다: 書く → 書いて."},
  {id:"gr13",t:"gr",q:"きのう スーパーで 野菜を （　）。",o:["買いました","買います","買って","買う"],e:"きのう(어제)가 있으므로 과거형 「~ました」를 씁니다."},
  {id:"gr14",t:"gr",q:"ここで 写真を （　）も いいですか。",o:["撮って","撮りて","撮て","撮った"],e:"허락을 구할 때는 「~ても いいですか」입니다. 撮る → 撮って."},
  {id:"gr15",t:"gr",q:"部屋で たばこを （　） ください。",o:["すわないで","すわなくて","すいないで","すわずに"],e:"'~하지 말아 주세요'는 「~ないで ください」입니다. 吸う(すう)의 부정형은 すわない입니다."},
  {id:"gr16",t:"gr",q:"わたしは 新しい くつが （　）。",o:["ほしいです","ほしいます","たいです","ほしがります"],e:"'~을 갖고 싶다'는 「~が ほしいです」입니다. ほしがります는 다른 사람의 바람을 말할 때 씁니다."},
  {id:"gr17",t:"gr",q:"日本へ （　）たいです。",o:["行き","行く","行って","行か"],e:"「~たい」는 ます형 어간에 붙습니다: 行きます → 行きたい."},
  {id:"gr18",t:"gr",q:"ご飯を （　） 前に、手を 洗います。",o:["食べる","食べた","食べて","食べ"],e:"「~まえに」 앞에는 사전형이 옵니다. 「~た あとで」와 구별하세요."},
  {id:"gr19",t:"gr",q:"ご飯を 食べた （　）、散歩します。",o:["あとで","まえに","ながら","ないで"],e:"た형 + あとで는 '~한 후에'입니다."},
  {id:"gr20",t:"gr",q:"音楽を （　）ながら 勉強します。",o:["聞き","聞く","聞いて","聞いた"],e:"「~ながら」(~하면서)는 ます형 어간에 붙습니다: 聞きながら."},
  {id:"gr21",t:"gr",q:"この かばんは あの かばん（　） 大きいです。",o:["より","ほど","から","まで"],e:"비교의 'B보다'는 より입니다. ほど는 「~ほど ~ない」처럼 부정과 함께 씁니다."},
  {id:"gr22",t:"gr",q:"果物の 中で りんごが （　） 好きです。",o:["いちばん","もっと","とても","よく"],e:"여러 개 가운데 '가장'은 いちばん입니다."},
  {id:"gr23",t:"gr",q:"A「だれが 来ましたか。」 B「山田さん（　） 来ました。」",o:["が","は","を","に"],e:"의문사(だれ)가 주어인 질문에는 답도 が로 합니다."},
  {id:"gr24",t:"gr",q:"夏休みに どこ（　） 行きませんでした。",o:["へも","へが","へを","へは"],e:"의문사 + も + 부정은 '아무 데도 ~하지 않았다'입니다: どこへも 行きませんでした."},
  {id:"gr25",t:"gr",q:"わたしは まだ 昼ご飯を （　）。",o:["食べて いません","食べませんでした","食べて います","食べました"],e:"'아직 ~하지 않았다(지금도 안 한 상태)'는 「まだ ~て いません」입니다."},
  {id:"gr26",t:"gr",q:"静か（　） 部屋ですね。",o:["な","の","い","だ"],e:"な형용사가 명사를 꾸밀 때는 な를 붙입니다: 静かな 部屋."},
  {id:"gr27",t:"gr",q:"これは だれ（　） かさですか。",o:["の","が","を","に"],e:"'누구의'는 だれの입니다."},
  {id:"gr28",t:"gr",q:"きのう 友だち（　） 電話を かけました。",o:["に","を","で","が"],e:"전화를 거는 상대는 に로 나타냅니다."},
  {id:"gr29",t:"gr",q:"ここから 駅（　） 十分 かかります。",o:["まで","より","を","で"],e:"범위의 끝 '~까지'는 まで입니다. 「~から ~まで」로 짝지어 씁니다."},
  {id:"gr30",t:"gr",q:"雨が 降って いますから、タクシー（　） 行きましょう。",o:["で","に","を","が"],e:"수단·방법 '~로'는 で입니다."},
  {id:"gr31",t:"gr",q:"だんだん 寒く （　）。",o:["なりました","しました","ありました","いました"],e:"い형용사 + く なる는 '~해지다'입니다: 寒く なりました(추워졌습니다)."},
  {id:"gr32",t:"gr",q:"りんごは 一つ 100円です。三つ（　） 300円です。",o:["で","に","を","が"],e:"수량을 합쳐 '~에(합계)'는 で입니다: 三つで 300円."}
];

<script>
/* questions-plus.js */
/* JLPT N5 연습 문제 추가분(자체 제작).
   gr 문법 형식 판단: o[0]이 정답.
   so 문장 만들기: parts는 바른 순서, star는 ★ 자리(0부터). 보기(o)와 문제 문장은 core.js가 만든다.
   bp 글의 문법: g는 글 id, n은 빈칸 번호. o[0]이 정답. 글은 passages에 있다. */
window.JLPT_DATA = window.JLPT_DATA || {};
window.JLPT_DATA.N5 = window.JLPT_DATA.N5 || {};
window.JLPT_DATA.N5.questions = (window.JLPT_DATA.N5.questions || []).concat([
  {id:"gr33",t:"gr",q:"毎朝 七時（　） 起きます。",o:["に","で","を","が"],e:"정해진 시각에는 に를 써요: 七時に 起きます."},
  {id:"gr34",t:"gr",q:"日曜日に 友だちの 家へ 遊び（　） 行きます。",o:["に","で","を","と"],e:"ます형 어간 + に 行く는 '~하러 가다'예요: 遊びに 行きます."},
  {id:"gr35",t:"gr",q:"毎晩 十一時（　） 寝ます。",o:["ごろ","ぐらい","まで","だけ"],e:"시각의 '쯤'은 ごろ, 시간의 길이나 양의 '쯤'은 ぐらい예요."},
  {id:"gr36",t:"gr",q:"駅まで 歩いて 十分（　） かかります。",o:["ぐらい","ごろ","に","を"],e:"걸리는 시간·양의 '정도'는 ぐらい(くらい)예요."},
  {id:"gr37",t:"gr",q:"A「コーヒーと 紅茶と どちらが 好きですか。」 B「紅茶（　） ほうが 好きです。」",o:["の","が","を","と"],e:"둘 중 하나를 고를 때는 「~の ほうが」를 써요."},
  {id:"gr38",t:"gr",q:"日曜日は テレビを 見たり、本を 読んだり（　）。",o:["します","あります","なります","います"],e:"여러 행동을 예로 들 때는 「~たり ~たり する」예요."},
  {id:"gr39",t:"gr",q:"宿題を して（　）、テレビを 見ます。",o:["から","まで","より","ので"],e:"て형 + から는 '~하고 나서'예요."},
  {id:"gr40",t:"gr",q:"明日は 雨（　）。",o:["でしょう","ましょう","ません","ください"],e:"추측은 「~でしょう」(~겠지요)예요."},
  {id:"gr41",t:"gr",q:"A「疲れましたね。」 B「そうですね。少し 休み（　）。」",o:["ましょう","でしょう","ませんでした","ください"],e:"함께 하자고 할 때는 「~ましょう」예요. 休みください는 맞지 않는 형태예요."},
  {id:"gr42",t:"gr",q:"冷蔵庫に 何（　） ありません。",o:["も","か","が","を"],e:"何も + 부정은 '아무것도 없다'예요."},
  {id:"gr43",t:"gr",q:"かばんの 中に 何（　） ありますか。",o:["か","も","の","で"],e:"何か는 '무언가'예요. 何も는 부정과 함께 써요."},
  {id:"gr44",t:"gr",q:"字を もっと（　） 書いて ください。",o:["大きく","大きい","大きな","大きいに"],e:"い형용사가 동사를 꾸밀 때는 い를 く로 바꿔요: 大きく 書く."},
  {id:"gr45",t:"gr",q:"部屋を（　） 掃除しました。",o:["きれいに","きれいな","きれく","きれいで"],e:"な형용사가 동사를 꾸밀 때는 に를 붙여요: きれいに 掃除する."},
  {id:"gr46",t:"gr",q:"兄は 医者（　） なりました。",o:["に","を","が","で"],e:"명사 + に なる는 '~이 되다'예요."},
  {id:"gr47",t:"gr",q:"この 部屋は（　） ありません。",o:["静かじゃ","静かく","静かない","静かくて"],e:"な형용사의 부정은 「~じゃ ありません」(~では ありません)이에요."},
  {id:"gr48",t:"gr",q:"スーパーで りんご（　） みかんなどを 買いました。",o:["や","も","で","に"],e:"여러 개 중 몇 가지를 예로 들 때는 や를 써요. など와 자주 함께 써요."},
  {id:"gr49",t:"gr",q:"あの 赤い かさは 田中さん（　）です。",o:["の","が","を","に"],e:"'~의 것'은 の로 나타내요: 田中さんのです."},
  {id:"gr50",t:"gr",q:"A「明日、いっしょに 映画を 見ませんか。」 B「いいですね。（　）。」",o:["見ましょう","見ません","見ませんでした","見て いません"],e:"권유를 받아들일 때는 「~ましょう」로 답해요."},
  {id:"gr51",t:"gr",q:"先生「宿題は もう 出しましたか。」 学生「すみません、（　）。」",o:["まだです","もうです","まだでした","もうでした"],e:"'아직 안 했다'는 짧게 「まだです」라고 해요."},
  {id:"gr52",t:"gr",q:"ここで 写真を 撮っては（　）。",o:["いけません","いいです","あります","ください"],e:"금지는 「~ては いけません」(~하면 안 됩니다)이에요."},

  {id:"so01",t:"so",pre:"わたしの",parts:["いちばん","好きな","食べ物は","カレー"],star:2,post:"です。",tr:"제가 가장 좋아하는 음식은 카레입니다.",e:"いちばん은 好きな를 꾸미고, 好きな 食べ物は가 주어가 돼요."},

  {id:"le02",t:"le",sit:"밥을 다 먹었습니다. 뭐라고 말합니까?",say:"ご飯を 食べました。何と 言いますか。",v:"M",

  {id:"le03",t:"le",sit:"회사에서 다른 사람보다 먼저 집에 갑니다. 뭐라고 말합니까?",say:"会社から 先に 帰ります。何と 言いますか。",v:"F",

  {id:"lr05",t:"lr",sp:"M",line:"駅まで どのぐらい かかりますか。",o:["十分ぐらいです","三時ごろです","駅の 前です"],e:"걸리는 시간을 물었으니 十分ぐらいです예요. ごろ는 시각에 써요."},

<script>
/* questions-more.js */
/* JLPT N5 연습 문제 추가분 2(자체 제작). 형식은 questions-plus.js, questions-listening.js와 같다.
   모의고사를 여러 번 봐도 문항이 덜 겹치도록 청해·문맥 규정·유의 표현을 늘린다. */
window.JLPT_DATA = window.JLPT_DATA || {};
window.JLPT_DATA.N5 = window.JLPT_DATA.N5 || {};
window.JLPT_DATA.N5.questions = (window.JLPT_DATA.N5.questions || []).concat([
  {id:"cx16",t:"cx",q:"パン屋の 前に 人が 長く （　） います。",o:["ならんで","すわって","はしって","のぼって"],e:"가게 앞에 사람들이 길게 '줄 서(ならんで)' 있어요."},
  {id:"cx17",t:"cx",q:"寒いですから、熱い コーヒーを （　）。",o:["飲みましょう","食べましょう","かぶりましょう","はきましょう"],e:"커피는 '마시다(飲む)'예요. かぶる는 모자, はく는 신발·바지에 써요."},
  {id:"cx18",t:"cx",q:"駅まで （　） 行きますか、バスで 行きますか。",o:["歩いて","すわって","泳いで","飛んで"],e:"'걸어서 갈래요, 버스로 갈래요?'라는 뜻이에요. 歩いて 行く = 걸어서 가다."},
  {id:"cx19",t:"cx",q:"部屋が 暗いですから、電気を （　） ください。",o:["つけて","けして","しめて","あけて"],e:"어두우니까 불을 '켜(つけて)' 주세요. けして는 '꺼'예요."},
  {id:"cx20",t:"cx",q:"誕生日に 友だちから 花を （　）。",o:["もらいました","あげました","かしました","かえしました"],e:"「(사람)から もらう」는 '~에게서 받다'예요. あげる는 내가 주는 것이에요."},
  {id:"cx21",t:"cx",q:"わたしの 部屋は 二（　）に あります。",o:["かい","ばん","まい","さつ"],e:"건물의 층은 かい(階)로 세요."},
  {id:"cx22",t:"cx",q:"毎日 日本語の 新聞を （　）。",o:["読みます","聞きます","書きます","話します"],e:"신문은 '읽다(読む)'예요."},
  {id:"cx23",t:"cx",q:"この 道を まっすぐ 行って、次の 角を 右に （　） ください。",o:["まがって","わたって","おりて","はいって"],e:"모퉁이에서 오른쪽으로 '돌다'는 まがる예요. わたる는 길·다리를 건너는 것이에요."},
  {id:"cx24",t:"cx",q:"部屋が 暑いですね。窓を （　）か。",o:["あけましょう","しめましょう","けしましょう","つけましょう"],e:"더우니까 창문을 '열까요(あけましょうか)?'예요."},

  {id:"pa09",t:"pa",q:"わたしは 毎朝 さんぽします。",o:["わたしは 朝は いつも さんぽします。","わたしは 朝 ときどき さんぽします。","わたしは 朝 さんぽしません。","わたしは きのうの 朝 さんぽしました。"],e:"毎朝(매일 아침)는 '아침에는 항상(朝は いつも)'과 같아요."},
  {id:"pa10",t:"pa",q:"この 部屋は せまいです。",o:["この 部屋は ひろくないです。","この 部屋は ひろいです。","この 部屋は きれいじゃ ありません。","この 部屋は あかるくないです。"],e:"せまい(좁다)는 ひろくない(넓지 않다)와 같아요."},
  {id:"pa11",t:"pa",q:"あの 人は わたしの おばです。",o:["あの 人は わたしの 母の いもうとです。","あの 人は わたしの 母の おとうとです。","あの 人は わたしの 母の 母です。","あの 人は わたしの 父の 父です。"],e:"おば는 부모님의 자매(이모·고모)예요. 남자 형제는 おじ예요."},
  {id:"pa12",t:"pa",q:"きょうは いそがしいです。",o:["きょうは しごとが たくさん あります。","きょうは ひまです。","きょうは やすみです。","きょうは しごとが ありません。"],e:"바쁘다는 것은 할 일이 많다는 뜻이에요. ひま는 반대말이에요."},
  {id:"pa13",t:"pa",q:"この りょうりは まずいです。",o:["この りょうりは おいしくないです。","この りょうりは おいしいです。","この りょうりは たかいです。","この りょうりは あまいです。"],e:"まずい(맛없다)는 おいしくない(맛있지 않다)와 같아요."},
  {id:"pa14",t:"pa",q:"もりさんは 歌が へたです。",o:["もりさんは 歌が じょうずじゃ ありません。","もりさんは 歌が すきじゃ ありません。","もりさんは 歌が じょうずです。","もりさんは 歌を うたいません。"],e:"へた(서투름)는 じょうずじゃ ない(잘하지 못함)와 같아요. 좋아하는지는 알 수 없어요."},
  {id:"pa15",t:"pa",q:"あさって テストが あります。",o:["あしたの つぎの 日に テストが あります。","きょう テストが あります。","きのうの つぎの 日に テストが あります。","あしたの まえの 日に テストが あります。"],e:"あさって(모레)는 '내일의 다음 날'이에요. きのうの つぎの 日와 あしたの まえの 日는 모두 '오늘'이에요."},

  {id:"lt08",t:"lt",set:"教室で 先生が 話して います。",ask:"学生は あした 教室に 来て、まず 何を しますか。",
   s:[["F","あしたの テストは 九時半からです。九時に 教室に 来て、まず この 紙に 名前を 書いて ください。それから、わたしの 話を 聞いて ください。"]],
   o:["紙に 名前を 書きます","先生の 話を 聞きます","テストを します","教室で 待ちます"],
   e:"9시에 와서 '먼저(まず)' 종이에 이름을 쓰고, 그다음에 선생님 이야기를 들어요. 시험은 9시 반부터예요.",
   tr:"선생님: 내일 시험은 9시 반부터예요. 9시에 교실에 와서 먼저 이 종이에 이름을 쓰세요. 그다음에 제 이야기를 들으세요."},
  {id:"lt09",t:"lt",set:"家で 女の 人と 男の 人が 話して います。",ask:"男の 人は 何を 買いに 行きますか。",
   s:[["F","あしたの パーティーの 飲み物、ありますか。"],["M","ジュースは 冷蔵庫に ありますよ。ビールが ありません。"],["F","じゃあ、ビールを 買って きて ください。お茶も ありますか。"],["M","お茶は 二本 あります。じゃあ、ビールだけ 買って きます。"]],
   o:["ビール","ジュース","お茶","ビールと お茶"],
   e:"주스와 차는 있고 맥주만 없어요. 「ビールだけ 買って きます」라고 했어요.",
   tr:"여자: 내일 파티 음료 있어요? / 남자: 주스는 냉장고에 있어요. 맥주가 없어요. / 여자: 그럼 맥주를 사 와 주세요. 차도 있어요? / 남자: 차는 두 병 있어요. 그럼 맥주만 사 올게요."},
  {id:"lt10",t:"lt",set:"駅で 女の 人と 駅の 人が 話して います。",ask:"女の 人は どの 電車に 乗りますか。",
   s:[["F","さくら駅へ 行きます。どの 電車ですか。"],["M","二番の 電車です。十時の 電車は 速いですが、さくら駅には 行きません。十時十分の 電車に 乗って ください。"],["F","わかりました。ありがとう ございます。"]],
   o:["十時十分の 電車","十時の 電車","十時二十分の 電車","九時五十分の 電車"],
   e:"10시 전철은 빠르지만 사쿠라역에 가지 않아요. 10시 10분 전철을 타요.",
   tr:"여자: 사쿠라역에 가요. 어느 전철이에요? / 역무원: 2번 전철이에요. 10시 전철은 빠르지만 사쿠라역에는 안 가요. 10시 10분 전철을 타세요. / 여자: 알겠습니다. 감사합니다."},
  {id:"lt11",t:"lt",set:"会社で 女の 人と 男の 人が 話して います。",ask:"男の 人は 何時に 会社を 出ますか。",
   s:[["F","あしたは 山田さんの 会社へ 行きますね。"],["M","はい、三時に 会います。"],["F","電車で 三十分 かかりますから、二時半に 出ますか。"],["M","いいえ、駅まで 十分 かかりますから、二時二十分に 出ます。"]],
   o:["二時二十分","二時半","三時","二時"],
   e:"전철 30분에 역까지 10분이 더 걸려서 2시 20분에 나가요.",
   tr:"여자: 내일 야마다 씨 회사에 가죠? / 남자: 네, 3시에 만나요. / 여자: 전철로 30분 걸리니까 2시 반에 나가요? / 남자: 아니요, 역까지 10분 걸리니까 2시 20분에 나가요."},
  {id:"lt12",t:"lt",set:"教室で 男の 学生と 女の 学生が 話して います。",ask:"女の 学生は 何を 貸しますか。",
   s:[["M","すみません、ペンを 忘れました。ペンを 貸して ください。"],["F","はい、どうぞ。黒と 赤が ありますよ。"],["M","黒い ペンを お願いします。それから、消しゴムも ありますか。"],["F","すみません、消しゴムは ありません。"]],
   o:["黒い ペン","赤い ペン","黒い ペンと 消しゴム","消しゴム"],
   e:"검은 펜을 부탁했고, 지우개는 없다고 했으니 검은 펜만 빌려줘요.",
   tr:"남학생: 저기, 펜을 깜빡했어요. 펜 좀 빌려주세요. / 여학생: 네, 여기요. 검은색이랑 빨간색이 있어요. / 남학생: 검은 펜 부탁해요. 그리고 지우개도 있어요? / 여학생: 미안해요, 지우개는 없어요."},
  {id:"lt13",t:"lt",set:"店で 男の 人と 店の 人が 話して います。",ask:"男の 人は どの かばんを 買いますか。",
   s:[["M","その 黒い かばんは いくらですか。"],["F","八千円です。こちらの 茶色い かばんは 五千円ですよ。"],["M","茶色い かばんは 少し 小さいですね。じゃあ、黒い かばんに します。"]],
   o:["黒い かばん","茶色い かばん","白い かばん","小さい かばん"],
   e:"갈색 가방은 조금 작아서 검은 가방으로 정했어요. 「~に します」는 '~로 하겠다(정하다)'예요.",
   tr:"남자: 그 검은 가방은 얼마예요? / 점원: 8천 엔이에요. 이쪽 갈색 가방은 5천 엔이에요. / 남자: 갈색 가방은 조금 작네요. 그럼 검은 가방으로 할게요."},
  {id:"lt14",t:"lt",set:"電話で 女の 人と 男の 人が 話して います。",ask:"二人は あした どこで 会いますか。",
   s:[["F","あしたは どこで 会いましょうか。駅の 前は どうですか。"],["M","駅の 前は 人が 多いですから、駅の 中の 本屋は どうですか。"],["F","いいですね。じゃあ、本屋で 十時に 会いましょう。"]],
   o:["駅の 中の 本屋","駅の 前","本屋の 前","喫茶店"],
   e:"역 앞은 사람이 많아서 역 안에 있는 서점에서 만나기로 했어요.",

    m07rs2: { text: "わたしの 家には 犬が 二匹と 猫が 一匹 います。犬は 毎朝 父と 散歩に 行きます。猫は 散歩が 好きじゃ ありませんから、いつも 家で 寝て います。", tr: "우리 집에는 개가 두 마리, 고양이가 한 마리 있습니다. 개는 매일 아침 아버지와 산책을 갑니다. 고양이는 산책을 좋아하지 않아서 늘 집에서 자고 있습니다." },

    {id:"m07pa2",t:"pa",q:"わたしは りょうりが じょうずです。",o:["わたしは りょうりを よく つくります。そして、おいしいです。","わたしは りょうりを つくりません。","わたしは りょうりが きらいです。","わたしは りょうりが へたです。"],e:"요리를 잘한다(じょうず)는 것은 잘 만들고 맛있다는 뜻이에요."},
    {id:"m07pa3",t:"pa",q:"きのう がっこうを やすみました。",o:["きのう がっこうへ いきませんでした。","きのう がっこうへ いきました。","きのう がっこうで やすみました。","きのう がっこうは やすみでした。"],e:"학교를 쉬었다는 것은 학교에 가지 않았다는 뜻이에요. 「学校は 休みでした」는 학교가 휴일이었다는 다른 뜻이에요."},
    {id:"m07gr1",t:"gr",q:"この 本は 先生（　） 借りました。",o:["に","で","を","が"],e:"빌린 상대는 に로 나타내요: 先生に 借りました."},
    {id:"m07gr2",t:"gr",q:"あしたは テストですから、早く （　）。",o:["寝ましょう","寝ました","寝て います","寝ませんでした"],e:"내일 일을 위해 지금 하자는 뜻이므로 「~ましょう」예요."},
    {id:"m07gr3",t:"gr",q:"わたしの 部屋は 兄の 部屋 （　） 広いです。",o:["より","ほど","まで","から"],e:"비교의 '~보다'는 より예요. ほど는 부정과 함께 써요."},
    {id:"m07gr4",t:"gr",q:"駅の 前に 新しい 店が （　）。",o:["できました","しました","なりました","ありました"],e:"새로 '생기다'는 できる예요."},
    {id:"m07gr5",t:"gr",q:"A「どの かばんが キムさんのですか。」 B「あの 黒い （　）です。」",o:["の","もの","こと","ところ"],e:"앞에 나온 명사(かばん)를 대신할 때는 の를 써요: 黒いのです."},
    {id:"m07gr6",t:"gr",q:"日曜日は 何（　） しませんでした。",o:["も","か","が","を"],e:"何も + 부정은 '아무것도 ~하지 않다'예요."},
    {id:"m07gr7",t:"gr",q:"わたしは 毎朝 新聞を 読んで （　） 会社へ 行きます。",o:["から","まで","より","ので"],e:"「~て から」는 '~하고 나서'예요."},
    {id:"m07gr8",t:"gr",q:"この ケーキ、一つ （　） いいですか。",o:["食べても","食べて","食べては","食べないで"],e:"허락을 구할 때는 「~ても いいですか」예요."},
    {id:"m07gr9",t:"gr",q:"A「夏休みに 何を しましたか。」 B「海で 泳いだり、山に （　） しました。」",o:["登ったり","登って","登ります","登る"],e:"「~たり ~たり する」는 여러 행동을 예로 들 때 써요."},
    {id:"m07so1",t:"so",pre:"これは",parts:["日本で","買った","時計","です"],star:2,post:"よ。",tr:"이건 일본에서 산 시계예요.",e:"日本で 買った가 時計를 꾸며요."},
    {id:"m07so2",t:"so",pre:"この",parts:["カメラは","父に","もらった","もの"],star:2,post:"です。",tr:"이 카메라는 아버지께 받은 것입니다.",e:"父に もらった가 もの를 꾸며요."},
    {id:"m07so3",t:"so",pre:"駅の",parts:["近くに","安くて","おいしい","店"],star:2,post:"が あります。",tr:"역 근처에 싸고 맛있는 가게가 있습니다.",e:"「安くて おいしい」가 店을 꾸며요."},
    {id:"m07so4",t:"so",pre:"あそこに",parts:["立って","いる","人","が"],star:2,post:"わたしの 先生です。",tr:"저기에 서 있는 사람이 제 선생님입니다.",e:"立って いる가 人을 꾸며요."},
    {id:"m07bpa",t:"bp",g:"m07bp",n:1,o:["に","で","を","と"],e:"앉는 곳은 に예요: いすに すわる."},
    {id:"m07bpb",t:"bp",g:"m07bp",n:2,o:["が","から","と","や"],e:"'시끌벅적하지만 좋아한다'처럼 앞뒤가 반대이므로 が예요."},
    {id:"m07bpc",t:"bp",g:"m07bp",n:3,o:["それから","でも","しかし","では"],e:"빨래·청소를 하고 '그다음에' 저녁을 만들어요."},
    {id:"m07bpd",t:"bp",g:"m07bp",n:4,o:["行きたいです","行きました","行って いました","行きませんでした"],e:"다음 주 일이므로 과거형은 맞지 않아요. 바람을 나타내는 「行きたいです」예요."},
    {id:"m07rs1a",t:"rs",g:"m07rs1",q:"テニスは いつに なりましたか。",o:["来週の 土曜日","あした","あさって","今週の 土曜日"],e:"내일은 비라서 없고, 다음 주 토요일에 하자고 했어요."},
    {id:"m07rs2a",t:"rs",g:"m07rs2",q:"毎朝 散歩に 行くのは どれですか。",o:["犬と 父","猫と 父","犬と 猫","猫だけ"],e:"개는 매일 아침 아버지와 산책하고, 고양이는 집에서 자요."},
    {id:"m07rma",t:"rm",g:"m07rm",q:"みそしるは どうでしたか。",o:["少し からかったです","とても おいしかったです","あまかったです","冷たかったです"],e:"튀김은 아주 맛있었지만 된장국은 조금 짰어요(からかった)."},
    {id:"m07rmb",t:"rm",g:"m07rm",q:"食事の あとで 何を しましたか。",o:["友だちと テレビで 映画を 見ました","映画館へ 行きました","てんぷらを 作りました","友だちの お母さんと 話しました"],e:"식사 후에 친구와 텔레비전으로 일본 영화를 봤어요."},

    {id:"m07lt1",t:"lt",set:"教室で 先生と 女の 学生が 話して います。",ask:"女の 学生は この あと まず 何を しますか。",
     s:[["M","テストが 終わったら、名前を もう 一度 見て ください。"],["F","はい。先生、テストは どこに 出しますか。"],["M","わたしの 机の 上に 置いて ください。"],["F","わかりました。"]],
     o:["名前を もう 一度 見ます","テストを 机に 置きます","先生に 質問します","教室を 出ます"],
     e:"시험이 끝나면 먼저 이름을 한 번 더 확인하고, 그다음에 선생님 책상에 둬요.",
     tr:"선생님: 시험이 끝나면 이름을 한 번 더 보세요. / 학생: 네. 선생님, 시험지는 어디에 내요? / 선생님: 제 책상 위에 두세요. / 학생: 알겠습니다."},
    {id:"m07lt2",t:"lt",set:"家で 男の 人と 女の 人が 話して います。",ask:"男の 人は 何を 持って 行きますか。",
     s:[["F","あした 山へ 行きますね。お弁当は 持って 行きますか。"],["M","はい。それから 水も 持って 行きます。"],["F","かさは？"],["M","あしたは 晴れですから、要りません。"]],
     o:["お弁当と 水","お弁当と かさ","水と かさ","お弁当だけ"],
     e:"도시락과 물을 가져가고, 맑아서 우산은 필요 없어요.",
     tr:"여자: 내일 산에 가죠? 도시락은 가져가요? / 남자: 네. 그리고 물도 가져가요. / 여자: 우산은요? / 남자: 내일은 맑으니까 필요 없어요."},
    {id:"m07lt3",t:"lt",set:"店で 男の 人と 店の 人が 話して います。",ask:"男の 人は 全部で いくら 払いますか。",
     s:[["M","この ノートを 二冊 ください。"],["F","一冊 二百円です。"],["M","じゃあ、四百円ですね。それから、この ペンも。"],["F","ペンは 百円です。"]],
     o:["五百円","四百円","三百円","二百円"],
     e:"노트 200엔 × 2권 = 400엔에 펜 100엔을 더해 500엔이에요.",
     tr:"남자: 이 노트 두 권 주세요. / 점원: 한 권에 200엔이에요. / 남자: 그럼 400엔이네요. 그리고 이 펜도요. / 점원: 펜은 100엔이에요."},
    {id:"m07lt4",t:"lt",set:"会社で 女の 人と 男の 人が 話して います。",ask:"男の 人は どこに 荷物を 置きますか。",
     s:[["F","その 荷物、机の 上に 置いて ください。"],["M","机の 上は 本が たくさん ありますよ。"],["F","じゃあ、いすの 横に 置いて ください。"],["M","はい、わかりました。"]],
     o:["いすの 横","机の 上","机の 下","ドアの 前"],
     e:"책상 위에는 책이 많아서 의자 옆에 둬요.",
     tr:"여자: 그 짐, 책상 위에 두세요. / 남자: 책상 위에는 책이 많은데요. / 여자: 그럼 의자 옆에 두세요. / 남자: 네, 알겠습니다."},
    {id:"m07lt5",t:"lt",set:"駅で 女の 人と 男の 人が 話して います。",ask:"二人は 何時の 電車に 乗りますか。",
     s:[["F","次の 電車は 十時五分ですね。"],["M","十時五分の 電車は 込んで いますよ。十時二十分のに しませんか。"],["F","映画は 十一時からですね。大丈夫ですか。"],["M","はい、三十分で 着きますから。"]],
     o:["十時二十分","十時五分","十一時","十時半"],
     e:"10시 5분 전철은 붐벼서 10시 20분 전철을 타요. 30분이면 도착해서 11시 영화에 늦지 않아요.",
     tr:"여자: 다음 전철은 10시 5분이네요. / 남자: 10시 5분 전철은 붐벼요. 10시 20분 것으로 하지 않을래요? / 여자: 영화는 11시부터죠. 괜찮아요? / 남자: 네, 30분이면 도착하니까요."},
    {id:"m07lt6",t:"lt",set:"家で お母さんと 男の 子が 話して います。",ask:"男の 子は 晩ご飯の 前に 何を しますか。",
     s:[["F","晩ご飯は 七時ですよ。晩ご飯の 前に お風呂に 入って ね。"],["M","はーい。宿題は？"],["F","宿題は 晩ご飯の あとで して ください。"]],
     o:["お風呂に 入ります","宿題を します","テレビを 見ます","晩ご飯を 作ります"],
     e:"저녁 전에 목욕을 하고, 숙제는 저녁 먹은 뒤에 해요.",
     tr:"엄마: 저녁은 7시야. 저녁 전에 목욕해. / 아이: 네. 숙제는요? / 엄마: 숙제는 저녁 먹고 나서 해."},
    {id:"m07lt7",t:"lt",set:"電話で 男の 人と 女の 人が 話して います。",ask:"女の 人は 男の 人の 家へ どうやって 行きますか。",
     s:[["M","駅に 着いたら、電話を ください。迎えに 行きます。"],["F","歩いて 行きますよ。遠いですか。"],["M","歩いて 二十分ぐらいです。バスも ありますよ。"],["F","じゃあ、バスで 行きます。"]],
     o:["バスで 行きます","歩いて 行きます","男の 人が 迎えに 来ます","タクシーで 行きます"],
     e:"걸어서 20분이라 버스로 가기로 했어요.",
     tr:"남자: 역에 도착하면 전화 주세요. 데리러 갈게요. / 여자: 걸어서 갈게요. 멀어요? / 남자: 걸어서 20분쯤이에요. 버스도 있어요. / 여자: 그럼 버스로 갈게요."},

    {id:"m07lp1",t:"lp",set:"女の 人と 男の 人が 話して います。",ask:"男の 人は 何の スポーツが いちばん 好きですか。",
     s:[["F","スポーツは 何が 好きですか。"],["M","テニスも サッカーも 好きです。"],["F","いちばんは？"],["M","いちばんは 野球です。毎週 見に 行きます。"]],
     o:["野球","テニス","サッカー","水泳"],
     e:"테니스도 축구도 좋아하지만 가장 좋아하는 것은 야구예요.",
     tr:"여자: 스포츠는 뭘 좋아해요? / 남자: 테니스도 축구도 좋아해요. / 여자: 가장 좋아하는 건요? / 남자: 가장 좋아하는 건 야구예요. 매주 보러 가요."},
    {id:"m07lp2",t:"lp",set:"男の 人と 女の 人が 話して います。",ask:"女の 人は どうして 日本語を 勉強して いますか。",
     s:[["M","どうして 日本語を 勉強して いますか。"],["F","日本の アニメが 好きですから。"],["M","仕事で 使いますか。"],["F","いいえ、仕事では 使いません。"]],
     o:["日本の アニメが 好きだから","仕事で 使うから","日本に 住みたいから","友だちが 日本人だから"],
     e:"일본 애니메이션을 좋아해서 공부해요. 일에서는 쓰지 않아요.",
     tr:"남자: 왜 일본어를 공부해요? / 여자: 일본 애니메이션을 좋아해서요. / 남자: 일에서 써요? / 여자: 아니요, 일에서는 안 써요."},
    {id:"m07lp3",t:"lp",set:"女の 学生と 男の 学生が 話して います。",ask:"男の 学生は きのう 何時間 勉強しましたか。",
     s:[["F","きのうは 何時間 勉強しましたか。"],["M","午前に 二時間、午後に 一時間です。"],["F","じゃあ、三時間ですね。"],["M","はい。夜は 勉強しませんでした。"]],
     o:["三時間","二時間","一時間","四時間"],
     e:"오전 2시간, 오후 1시간, 모두 3시간이에요.",
     tr:"여학생: 어제는 몇 시간 공부했어요? / 남학생: 오전에 2시간, 오후에 1시간이요. / 여학생: 그럼 3시간이네요. / 남학생: 네. 밤에는 공부 안 했어요."},
    {id:"m07lp4",t:"lp",set:"男の 人と 女の 人が 話して います。",ask:"女の 人の 誕生日は いつですか。",
     s:[["M","誕生日は いつですか。"],["F","七月 二十日です。"],["M","七月 十日ですか。"],["F","いいえ、二十日です。はつかです。"]],
     o:["七月 二十日","七月 十日","四月 二十日","四月 十日"],
     e:"7월 20일(はつか)이에요. 10일(とおか)이 아니에요.",
     tr:"남자: 생일이 언제예요? / 여자: 7월 20일이에요. / 남자: 7월 10일이요? / 여자: 아니요, 20일이에요. '하쓰카'요."},
    {id:"m07lp5",t:"lp",set:"女の 人と 男の 人が 話して います。",ask:"男の 人は 夏休みに 何を しますか。",
     s:[["F","夏休みは 国へ 帰りますか。"],["M","いいえ、帰りません。"],["F","じゃあ、旅行ですか。"],["M","いいえ、アルバイトを します。お金を ためて、冬に 旅行したいです。"]],
     o:["アルバイトを します","国へ 帰ります","旅行を します","日本語を 勉強します"],
     e:"여름방학에는 아르바이트를 하고, 여행은 겨울에 하고 싶다고 했어요.",
     tr:"여자: 여름방학에 고향에 가요? / 남자: 아니요, 안 가요. / 여자: 그럼 여행이에요? / 남자: 아니요, 아르바이트를 해요. 돈을 모아서 겨울에 여행하고 싶어요."},
    {id:"m07lp6",t:"lp",set:"男の 人と 女の 人が 話して います。",ask:"女の 人の かばんは どれですか。",
     s:[["M","この 黒い かばんは 山田さんのですか。"],["F","いいえ、わたしのは 茶色です。"],["M","大きいのですか。"],["F","いいえ、小さい 茶色の かばんです。"]],
     o:["小さい 茶色の かばん","大きい 茶色の かばん","小さい 黒い かばん","大きい 黒い かばん"],
     e:"검은 가방이 아니라 작은 갈색 가방이에요.",
     tr:"남자: 이 검은 가방은 야마다 씨 거예요? / 여자: 아니요, 제 건 갈색이에요. / 남자: 큰 거예요? / 여자: 아니요, 작은 갈색 가방이에요."},

    {id:"m07le1",t:"le",sit:"친구에게 오랜만에 만났습니다. 뭐라고 말합니까?",say:"友だちに 久しぶりに 会いました。何と 言いますか。",v:"F",
     o:["お久しぶりです","はじめまして","おやすみなさい"],e:"오랜만에 만나면 「お久しぶりです」예요."},
    {id:"m07le2",t:"le",sit:"친구가 시험에 합격했습니다. 뭐라고 말합니까?",say:"友だちが テストに 合格しました。何と 言いますか。",v:"M",
     o:["おめでとう","すみません","いただきます"],e:"축하할 때는 「おめでとう」예요."},
    {id:"m07le3",t:"le",sit:"식당에서 메뉴를 보고 싶습니다. 점원에게 뭐라고 말합니까?",say:"レストランで メニューが 見たいです。何と 言いますか。",v:"F",
     o:["すみません、メニューを ください","メニューを どうぞ","メニューは いりません"],e:"달라고 할 때는 「~を ください」예요."},
    {id:"m07le4",t:"le",sit:"친구에게 무거운 짐을 들어 주겠다고 합니다. 뭐라고 말합니까?",say:"友だちの 荷物が 重そうです。何と 言いますか。",v:"M",
     o:["持ちましょうか","持って ください","持ちませんか"],e:"도와주겠다고 할 때는 「~ましょうか」예요."},
    {id:"m07le5",t:"le",sit:"잠자리에 듭니다. 가족에게 뭐라고 말합니까?",say:"これから 寝ます。家族に 何と 言いますか。",v:"F",
     o:["おやすみなさい","おはようございます","いってきます"],e:"자기 전에는 おやすみなさい예요."},

    {id:"m07lr1",t:"lr",sp:"M",line:"この ペン、だれのですか。",o:["田中さんのです","ペンです","机の 上です"],e:"'누구 것'인지 물었으니 사람으로 답해요."},

    m11bp: { title: "わたしの 町の 公園", by: "キム(会社員)", text: "わたしの アパートの 近くに 大きい 公園が あります。公園（1） 池や 花が たくさん あります。わたしは 週末に よく この 公園へ 行きます。朝 早く 行くと、人が 少なくて 静かです。わたしは 池の まわり（2） 歩いて、それから ベンチで コーヒーを 飲みます。春は さくらの 花が とても きれいです。来年の 春は 国の 家族（3） いっしょに 花を 見たいです。家族は まだ 日本へ 来た ことが（4）。", tr: "제 아파트 근처에 큰 공원이 있습니다. 공원에는 연못과 꽃이 많이 있습니다. 저는 주말에 자주 이 공원에 갑니다. 아침 일찍 가면 사람이 적고 조용합니다. 저는 연못 주위를 걷고, 그다음에 벤치에서 커피를 마십니다. 봄에는 벚꽃이 아주 예쁩니다. 내년 봄에는 고향 가족과 함께 꽃을 보고 싶습니다. 가족은 일본에 온 적이 없습니다." }
  });

    m11rs1: { text: "（家で）\nテーブルの 上に、この メモが あります。\n\nたけしへ\nおばあさんの 家へ 行きます。夜 八時ごろ 帰ります。晩ご飯は 冷蔵庫に あります。食べる 前に 電子レンジで 温めて ください。\n\n母", tr: "(집에서) 테이블 위에 이 메모가 있습니다. / 다케시에게, 할머니 댁에 가. 밤 8시쯤 돌아올게. 저녁은 냉장고에 있어. 먹기 전에 전자레인지로 데워 먹으렴. / 엄마" },

    m11rm: { title: "日本の 電車", text: "日本の 電車は とても 便利です。わたしの 国の 電車は よく 遅れますが、日本の 電車は 時間どおりに 来ます。それに、駅の 名前は 日本語と 英語で 書いて ありますから、わたしにも わかります。\n　でも、朝の 電車は とても 込んで います。はじめて 乗った 時、本当に びっくりしました。今は 朝 少し 早く 家を 出て、すいて いる 電車に 乗って います。", tr: "일본 전철은 아주 편리합니다. 우리나라 전철은 자주 늦지만 일본 전철은 시간대로 옵니다. 게다가 역 이름이 일본어와 영어로 쓰여 있어서 저도 알 수 있습니다. 하지만 아침 전철은 아주 붐빕니다. 처음 탔을 때 정말 놀랐습니다. 지금은 아침에 조금 일찍 집을 나서서 한산한 전철을 타고 있습니다." },
    m11ri: { title: "さくら市 スポーツセンター", text: "【プール】　午前 9:00〜午後 8:00　（月曜日は 休み）\n【テニス】　午前 10:00〜午後 6:00　（水曜日は 休み）\n\nお金：大人 一回 500円、子ども 一回 200円\n※ 日曜日は 子どもは 無料です。", tr: "사쿠라시 스포츠센터 / 수영장 오전 9:00~오후 8:00 (월요일 휴무) / 테니스 오전 10:00~오후 6:00 (수요일 휴무) / 요금: 어른 1회 500엔, 어린이 1회 200엔 / ※ 일요일은 어린이 무료입니다." }

        const valid = secs.length > 0 && secs[0][0] === 0 && secs[secs.length - 1][1] === n && secs.every((x, k) => x[0] < x[1] && (k === 0 || x[0] === secs[k - 1][1]));
        if (!valid) secs = [[0, n, App.MOCK_MIN]];

  App.freshState = freshState;

  function loadLocal() { try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : freshState(); } catch (e) { return freshState(); } }

  App.S = loadLocal();
  App.save = function () { App.S.updatedAt = Date.now(); saveLocal(); Sync.schedule(1500); };
  App.onRemote = null; /* ui.js가 등록: 다른 기기 기록으로 바뀌었을 때 다시 그림 */
  App.onSyncMode = null;

  /* ---------- 계정 저장(db capability, 사용자별 비공개 경로) ---------- */
  const Sync = {
    ref: null, mode: 'local', writing: false, again: false, timer: 0,
    set(m) { this.mode = m; if (App.onSyncMode) App.onSyncMode(m); },
    schedule(ms) { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms); },
    async push() {
      if (!this.ref) return;

      this.writing = true;

        await this.ref.set({ state: JSON.parse(JSON.stringify(App.S)), savedAt: Date.now() });

      } catch (e) {

  App.initSync = async function () {

  /* ---------- 날짜·목표·연속 달성 ---------- */
  App.today = function () { const t = App.ymd(); if (App.S.today.date !== t) App.S.today = { date: t, wids: [] }; return t; };

  /* ---------- XP·레벨 ---------- */
  App.totalXP = function () { let n = 0; for (const d of Object.values(App.S.days)) n += d.x || 0; return n; };
  /* 레벨 L은 누적 25·L·(L-1) XP에서 시작한다: 2레벨 50, 3레벨 150, 4레벨 300, 5레벨 500 */
  App.levelOf = function (xp) { let L = 1; while (L < 999 && 25 * L * (L + 1) <= xp) L++; return L; };
  App.levelRange = (L) => [25 * L * (L - 1), 25 * L * (L + 1)];
  App.levelUpTo = 0;

    if (!add) return 0;
    const before = App.levelOf(App.totalXP());
    dayRec(App.today()).x += add;
    const after = App.levelOf(App.totalXP());
    if (after > before) App.levelUpTo = after;
    return add;
  };
  function touchWord(id) { const t = App.today(); const w = App.S.today.wids; if (!w.includes(id)) w.push(id); dayRec(t).w = w.length; }
  App.celebrate = false;
  App.checkGoal = function () {
    const t = App.today(); const d = App.S.days[t];

    if (d.w >= App.S.settings.goalW && d.q >= App.S.settings.goalQ) {
      d.g = true;
      const st = App.S.streak;
      st.cur = st.last === App.addDays(t, -1) ? st.cur + 1 : 1;
      st.last = t;

      App.addXP(10);
      App.celebrate = true;
    }
  };
  App.streakNow = function () { const t = App.ymd(); const st = App.S.streak; return st.last === t || st.last === App.addDays(t, -1) ? st.cur : 0; };
  App.dueCount = function () { const t = App.ymd(); let n = 0; for (const p of Object.values(App.S.words)) if (p.b >= 1 && p.due <= t) n++; return n; };
  App.learnedCount = function () { let n = 0; for (const p of Object.values(App.S.words)) if (p.b >= 3) n++; return n; };

  /* ---------- 단어: 카드(라이트너 상자 1·3·7·14·30일) ---------- */
  function addWrongW(id) { const w = App.S.wrong.w[id] || { n: 0, at: '' }; w.n++; w.at = App.ymd(); App.S.wrong.w[id] = w; }
  App.gradeCard = function (id, known) {
    const t = App.today();
    const p = App.S.words[id] || { b: 0, due: t, n: 0, x: 0 };
    p.n++;
    if (known) { p.b = Math.min(5, p.b + 1); p.due = App.addDays(t, App.INTERVAL[p.b]); }
    else { p.b = 0; p.due = t; p.x++; addWrongW(id); }
    App.S.words[id] = p;
    touchWord(id);
    const xp = App.addXP(1);
    App.checkGoal();
    return xp;
  };
  /* topic을 주면 그 주제 단어만 고른다 */
  App.buildCards = function (n, topic) {
    const S = App.S; const t = App.ymd(); const used = new Set(); const out = [];
    const inTopic = (id) => !topic || (App.WMAP.has(id) && App.WMAP.get(id).topic === topic);
    const push = (id, cap) => { if (out.length < n && !used.has(id) && App.WMAP.has(id) && inTopic(id) && (cap === undefined || cap.left-- > 0)) { used.add(id); out.push(id); } };
    const capW = { left: 5 }, capD = { left: 5 };
    Object.entries(S.wrong.w).sort((a, b) => b[1].n - a[1].n).forEach(([id]) => push(id, capW));
    App.WORDS.filter((w) => { const p = S.words[w.id]; return p && p.b >= 1 && p.due <= t; })
      .sort((a, b) => S.words[a.id].due.localeCompare(S.words[b.id].due)).forEach((w) => push(w.id, capD));
    App.WORDS.filter((w) => !S.words[w.id]).forEach((w) => push(w.id));
    Object.keys(S.wrong.w).forEach((id) => push(id));
    App.shuffle(App.WORDS).sort((a, b) => (S.words[a.id] ? S.words[a.id].b : 0) - (S.words[b.id] ? S.words[b.id].b : 0)).forEach((w) => push(w.id));

  };

  /* ---------- 단어 테스트(4지선다) ---------- */
  const tokens = (m) => m.replace(/\(.*?\)/g, '').split(/[·,]/).map((s) => s.trim()).filter(Boolean);
  function distractors(word, k) {
    const own = new Set(tokens(word.m)); const seenW = new Set([word.w]); const seenM = new Set([word.m]); const out = [];
    for (const x of App.shuffle(App.WORDS)) {
      if (out.length >= k) break;
      if (x.id === word.id || x.p !== word.p || seenW.has(x.w) || seenM.has(x.m) || tokens(x.m).some((tk) => own.has(tk))) continue;
      seenW.add(x.w); seenM.add(x.m); out.push(x);
    }
    return out;
  }
  App.makeTest = function (ids) {
    return ids.map((id, k) => {
      const w = App.WMAP.get(id); const dir = k % 2 === 0 ? 'jk' : 'kj';
      const opts = App.shuffle([w, ...distractors(w, 3)]).map((x) => (dir === 'jk' ? x.m : x.w));
      return { id, dir, opts, ans: dir === 'jk' ? w.m : w.w, picked: null };
    });
  };
  App.buildTestIds = function (n) {
    const used = new Set(); const out = [];
    const push = (id) => { if (out.length < n && !used.has(id) && App.WMAP.has(id)) { used.add(id); out.push(id); } };
    App.today();
    App.shuffle(App.S.today.wids).forEach(push);
    App.shuffle(Object.keys(App.S.words)).forEach(push);
    App.shuffle(App.WORDS.map((w) => w.id)).forEach(push);
    return out;
  };
  App.answerTest = function (id, ok) {

    let p = App.S.words[id];
    if (ok) {
      d.tc++;
      delete App.S.wrong.w[id];
      if (!p) p = { b: 1, due: App.addDays(t, 1), n: 0, x: 0 };
    } else {
      p = p || { b: 0, due: t, n: 0, x: 0 };
      p.b = 0; p.due = t; p.x++;
      addWrongW(id);
    }
    p.n++;
    App.S.words[id] = p;
    touchWord(id);
    const xp = App.addXP(ok ? 2 : 1);
    App.checkGoal();
    return xp;
  };

  /* ---------- 문제 ---------- */
  App.answerQ = function (id, ok) {
    const t = App.today(); const d = dayRec(t);
    d.q++; if (ok) d.qc++;
    const s = App.S.qs[id] || { n: 0, c: 0 };
    s.n++; if (ok) s.c++;
    App.S.qs[id] = s;
    if (ok) delete App.S.wrong.q[id];
    else { const w = App.S.wrong.q[id] || { n: 0, at: '' }; w.n++; w.at = t; App.S.wrong.q[id] = w; }
    const xp = App.addXP(ok ? 2 : 1);
    App.checkGoal();
    return xp;
  };
  App.buildQuiz = function (type, n, onlyIds) {
    const S = App.S;
    const pool = onlyIds ? onlyIds.map((id) => App.QMAP.get(id)).filter(Boolean) : App.QS.filter((q) => App.inType(q, type) && App.isOpenQ(q));
    const used = new Set(); const out = [];
    const push = (q) => { if (out.length < n && !used.has(q.id)) { used.add(q.id); out.push(q.id); } };
    const ratio = (q) => { const s = S.qs[q.id]; return s && s.n ? s.c / s.n : 0; };
    if (!onlyIds) {
      App.shuffle(pool.filter((q) => !S.qs[q.id])).forEach(push);
      App.shuffle(pool.filter((q) => S.wrong.q[q.id])).forEach(push);
    }
    App.shuffle(pool).sort((a, b) => ratio(a) - ratio(b)).forEach(push);
    return out.map((id) => { const q = App.QMAP.get(id); return q.t === 'so' ? { id, opts: App.shuffle(q.o), tiles: App.shuffle(q.parts), order: [], picked: null, done: false } : { id, opts: App.shuffle(q.o), picked: null, done: false }; });
  };

  /* ---------- 미니 모의고사 ---------- */
  /* 글이 있는 유형(글의 문법·중문)은 글 하나를 골라 그 글의 문항을 순서대로 낸다 */
  function pickType(t, k) {
    const pool = App.QS.filter((q) => q.t === t && App.isOpenQ(q));
    if (t === 'bp' || t === 'rm') {
      const groups = [...new Set(pool.map((q) => q.g))];
      const g = App.shuffle(groups).find((x) => pool.filter((q) => q.g === x).length >= k) || groups[0];
      return pool.filter((q) => q.g === g).sort((a, b) => (a.n || 0) - (b.n || 0) || a.id.localeCompare(b.id)).slice(0, k);
    }
    return App.shuffle(pool).slice(0, k);
  }
  App.startMock = function (kind, setId) {
    if (kind === 'set') {
      const set = App.SETMAP.get(setId); if (!set) return false;
      const ids = []; const secs = [];
      set.secs.forEach((list, k) => { const from = ids.length; ids.push(...list); secs.push([from, ids.length, App.FULL_PLAN[k].min]); });
      const opts = {}; ids.forEach((id) => { opts[id] = App.shuffle(App.QMAP.get(id).o); });

  /* 지금 교시를 제출한다. 다음 교시가 있으면 쉬는 시간으로 넘기고 null, 마지막이면 채점 결과를 돌려준다 */

      const my = Object.prototype.hasOwnProperty.call(run.ans, id) ? run.ans[id] : null;
      const ok = my === q.o[0];
      if (ok) c++;

  /* ---------- 배지: 기록에서 조건을 계산하고, 처음 채운 날을 저장한다 ---------- */

  App.BADGES = [

    ['l30', '익힌 단어 30', '3단계 이상 단어가 30개예요', () => App.learnedCount() >= 30],
    ['l100', '익힌 단어 100', '3단계 이상 단어가 100개예요', () => App.learnedCount() >= 100],
    ['q100', '문제 100', '문제를 100번 풀었어요', () => qTries() >= 100],
    ['m1', '첫 모의고사', '모의고사를 처음 제출했어요', () => App.S.mocks.length >= 1],
    ['m80', '모의고사 80%', '모의고사에서 80% 이상 맞혔어요', () => App.S.mocks.some((m) => m.c >= m.n * 0.8)],
    ['mAll', '모의고사 만점', '모의고사를 모두 맞혔어요', () => App.S.mocks.some((m) => m.c === m.n)],
    ['kh', 'ひらがな 만점', '히라가나 퀴즈를 모두 맞혔어요', () => App.S.kanaBest.h >= 10],
    ['kk', 'カタカナ 만점', '가타카나 퀴즈를 모두 맞혔어요', () => App.S.kanaBest.k >= 10],
    ['p1', '첫 레슨', '학습 경로의 레슨을 처음 마쳤어요', () => Object.keys(App.S.path.done).length >= 1],
    ['p10', '레슨 10개', '레슨을 10개 마쳤어요', () => Object.keys(App.S.path.done).length >= 10],
    ['p30', '레슨 30개', '레슨을 30개 마쳤어요', () => Object.keys(App.S.path.done).length >= 30],
    ['pK', '가나 정복', '히라가나·가타카나 단원을 모두 마쳤어요', () => ['kh1', 'kh2', 'kh3', 'kh4', 'kh5', 'kk1', 'kk2', 'kk3', 'kk4', 'kk5'].every((id) => App.S.path.done[id])],
    ['ms5', '모의고사 5회', '회차별 실전 모의고사를 5회 끝냈어요', () => Object.keys(App.S.sets).length >= 5],
    ['ms20', '모의고사 20회', '회차별 실전 모의고사 20회를 모두 끝냈어요', () => Object.keys(App.S.sets).length >= 20],
    ['x500', 'XP 500', '누적 500 XP를 모았어요', () => App.totalXP() >= 500],
    ['x2000', 'XP 2000', '누적 2000 XP를 모았어요', () => App.totalXP() >= 2000]
  ].map(([id, name, desc, test]) => ({ id, name, desc, test }));
  /* 새로 얻은 배지 목록을 돌려준다(저장은 부르는 쪽에서) */
  App.checkBadges = function () {
    const got = [];
    for (const b of App.BADGES) {
      if (App.S.badges[b.id]) continue;
      let ok = false; try { ok = !!b.test(); } catch (e) { ok = false; }
      if (ok) { App.S.badges[b.id] = App.ymd(); got.push(b); }
    }
    return got;
  };
  App.recordKana = function (sc, c, n) {
    const key = sc === 'k' ? 'k' : 'h';
    if (n === 10) App.S.kanaBest[key] = Math.max(App.S.kanaBest[key], clampInt(c, 0, 10, 0));
    return App.addXP(clampInt(c, 0, 10, 0));
  };

  /* ---------- 설정·초기화 ---------- */
  App.applySettings = function (examDate, goalW, goalQ) {
    App.S.settings = { examDate, goalW, goalQ };
    App.checkGoal();
    App.save();
  };
  App.resetAll = function () {
    const keep = App.S.settings;
    App.S = freshState();
    App.S.settings = keep;
    App.save();
  };
})();

</script>
<script>
/* ui.js */
/* 화면 그리기와 입력 처리 */
(function () {
  'use strict';
  const A = window.App;
  const esc = A.esc;
  const $view = document.getElementById('view');
  const $main = document.getElementById('main');
  const $overlay = document.getElementById('overlay');
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const NUM = ['1', '2', '3', '4'];
  const motionQ = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reduced = () => !!(motionQ && motionQ.matches);

  let view = 'home';
  let X = null;            /* 진행 중인 학습 세션 */
  let quizType = 'all';
  let lastMock = null;
  let resetAsk = false;
  let submitAsk = false;
  let settingsMsg = '';
  let busy = false;        /* 카드가 날아가는 동안 입력을 막는다 */

  const TAB_OF = { home: 'home', words: 'words', cards: 'words', cardsDone: 'words', test: 'words', testDone: 'words', quiz: 'quiz', qsess: 'quiz', qdone: 'quiz', mock: 'quiz', mockres: 'quiz', notes: 'notes', stats: 'stats', guide: 'home', dict: 'words', mocklist: 'quiz' };
  const tabFor = (v) => (X && X.from === 'notes' ? 'notes' : TAB_OF[v] || 'home');

  /* ---------- 작은 부품 ---------- */
  const jp = (s) => `<span class="jp">${esc(s)}</span>`;
  const qText = (s) => esc(s).replace(/\[(.+?)\]/g, '<u>$1</u>').replace(/（　）/g, '<span class="blank">（　　）</span>');
  const plain = (s) => s.replace(/\[(.+?)\]/g, '$1');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const canSpeak = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  const sayBtn = (text, label) => (canSpeak && jaReady() ? `<button type="button" class="say" data-act="speak" data-say="${esc(text)}" aria-label="${esc(label)} 발음 듣기">▶ 발음</button>` : '');
  /* 효과음: Web Audio로 짧게 합성한다(파일 없음). 설정에서 끌 수 있고 이 기기에만 저장한다. */
  const SOUND_KEY = 'jlpt-n5-sound';
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  let actx = null;
  const SFX = {
    ok: [[880, 0, 0.09, 'sine', 0.13], [1318.5, 0.08, 0.16, 'sine', 0.13]],
    bad: [[233, 0, 0.14, 'triangle', 0.16], [174.6, 0.12, 0.22, 'triangle', 0.16]],
    card: [[660, 0, 0.05, 'triangle', 0.06]],
    combo: [[987.8, 0, 0.07, 'sine', 0.11], [1318.5, 0.06, 0.07, 'sine', 0.11], [1760, 0.12, 0.14, 'sine', 0.11]],
    done: [[523.3, 0, 0.11, 'sine', 0.12], [659.3, 0.1, 0.11, 'sine', 0.12], [784, 0.2, 0.11, 'sine', 0.12], [1046.5, 0.3, 0.3, 'sine', 0.12]],
    level: [[392, 0, 0.1, 'square', 0.05], [523.3, 0.1, 0.1, 'square', 0.05], [659.3, 0.2, 0.1, 'square', 0.05], [784, 0.3, 0.32, 'square', 0.05]],
    badge: [[1046.5, 0, 0.08, 'sine', 0.1], [1568, 0.08, 0.2, 'sine', 0.1]]
  };
  function sfx(kind) {
    if (!soundOn || !SFX[kind]) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.01;
      for (const [freq, at, dur, type, vol] of SFX[kind]) {
        const o = actx.createOscillator(); const g = actx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + at); o.stop(t0 + at + dur + 0.03);
      }
    } catch (e) { /* 소리를 못 내는 환경 */ }
  }
  function setSound(on) { soundOn = !!on; try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) { /* 이번 접속에서만 적용 */ } }
  const buzz = (p) => { try { if (typeof navigator.vibrate !== 'function' || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return; navigator.vibrate(p); } catch (e) { /* 진동을 못 쓰는 기기 */ } };
  function meter(label, cur, goal, unit) {
    const done = cur >= goal;
    return `<div class="meter">
      <div class="meter-top"><span>${label}</span><span class="num">${cur} / ${goal}${unit}</span></div>
      <div class="track"><i style="width:${Math.min(100, pct(cur, goal))}%"></i></div>
      <div class="meter-note">${done ? '<b>✓ 달성</b>' : `${goal - cur}${unit} 남았어요`}</div>
    </div>`;
  }
  function progress(i, n, label, extra) {
    return `<div class="sess-top"><span>${label}</span><span class="sess-right">${extra || ''}<span class="num">${i + 1} / ${n}</span></span></div><div class="track thin"><i style="width:${pct(i + 1, n)}%"></i></div>`;
  }
  function ddayText() {
    const d = A.diffDays(A.ymd(), A.S.settings.examDate);
    return d > 0 ? `D-${d}` : d === 0 ? 'D-DAY' : '시험 종료';
  }
  function examLabel() {
    const [y, m, d] = A.S.settings.examDate.split('-').map(Number);
    return `${y}년 ${m}월 ${d}일(${DOW[new Date(y, m - 1, d).getDay()]})`;
  }
  function greeting() {
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return ['おはよう', '좋은 아침이에요'];
    if (h >= 11 && h < 18) return ['こんにちは', '오늘도 조금씩 해 봐요'];
    return ['こんばんは', '오늘 하루도 수고했어요'];
  }
  function syncText(m) { return m === 'cloud' ? '계정에 저장' : m === 'full' ? '계정 저장 공간 부족' : '이 기기에 저장'; }

  /* ---------- 화면 테마: 기기 설정 / 밝게 / 어둡게 (이 기기에만, 학습 기록과 따로 저장) ---------- */
  const THEME_KEY = 'jlpt-n5-theme';
  const THEME_BG = { light: '#f6f2ea', dark: '#121419' };
  const THEMES = [['system', '기기 설정'], ['light', '밝게'], ['dark', '어둡게']];
  const ICON_SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const darkQ = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let themePref = 'system';
  try { const t = localStorage.getItem(THEME_KEY); if (t === 'light' || t === 'dark') themePref = t; } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  const effectiveTheme = () => (themePref === 'system' ? (darkQ && darkQ.matches ? 'dark' : 'light') : themePref);
  function applyTheme() {
    const root = document.documentElement;
    if (themePref === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', themePref);
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      const own = (m.getAttribute('media') || '').includes('dark') ? 'dark' : 'light';
      m.setAttribute('content', THEME_BG[themePref === 'system' ? own : themePref]);
    });
    const btn = document.getElementById('theme-btn');
    if (btn) {
      const dark = effectiveTheme() === 'dark';
      btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
      btn.setAttribute('aria-label', dark ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
    }
  }
  function setTheme(t) {
    if (!THEMES.some(([k]) => k === t)) return;
    themePref = t;
    try { if (t === 'system') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, t); } catch (e) { /* 이번 접속에서만 적용 */ }
    const root = document.documentElement;
    if (!reduced()) { root.classList.add('theme-anim'); setTimeout(() => root.classList.remove('theme-anim'), 350); }
    applyTheme();
  }
  if (darkQ && typeof darkQ.addEventListener === 'function') darkQ.addEventListener('change', () => { if (themePref === 'system') applyTheme(); });

  /* ---------- 홈 화면 앱(PWA): 사이트 배포본에만 manifest가 있다 ---------- */
  let installPrompt = null;
  const hasManifest = () => !!document.querySelector('link[rel="manifest"]');
  const standalone = () => (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function installPanel() {
    if (!hasManifest()) return '';
    if (standalone()) return '<section class="panel"><h2>홈 화면 앱</h2><p class="small">✓ 홈 화면 앱으로 쓰고 있어요. 한 번 연 뒤에는 인터넷이 없어도 열려요.</p></section>';
    const steps = isIOS()
      ? '<li>사파리 아래쪽의 공유 버튼(네모에 위쪽 화살표)을 눌러요.</li><li>목록에서 "홈 화면에 추가"를 고르고 "추가"를 눌러요.</li>'
      : '<li>크롬 오른쪽 위 메뉴(점 세 개)를 눌러요.</li><li>"홈 화면에 추가" 또는 "앱 설치"를 고르고 "설치"를 눌러요.</li>';
    return `<section class="panel" id="install-panel"><h2>홈 화면에 추가</h2>
        <p class="small">홈 화면에 아이콘을 만들면 앱처럼 바로 열리고, 한 번 연 뒤에는 인터넷이 없어도 쓸 수 있어요. 학습 기록은 지금처럼 이 휴대폰에 그대로 남아요.</p>
        ${installPrompt ? '<button class="btn primary wide" data-act="install">홈 화면에 추가</button>' : `<ol class="steps">${steps}</ol>`}
      </section>`;
  }
  if ('serviceWorker' in navigator && hasManifest() && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 오프라인 저장을 못 쓰는 환경 */ }); });
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; if (view === 'stats' || view === 'home') render(true); });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('홈 화면에 추가했어요.'); if (view === 'stats' || view === 'home') render(true); });

  /* ---------- XP·레벨 ---------- */
  function levelPanel() {
    const xp = A.totalXP(); const L = A.levelOf(xp); const [lo, hi] = A.levelRange(L); const today = A.dayView(A.ymd()).x || 0;
    return `<section class="panel lv">
        <div class="lv-row">
          <div class="lv-badge" role="img" aria-label="레벨 ${L}"><span>Lv</span><b class="num">${L}</b></div>
          <div class="lv-main">
            <div class="meter-top"><span>오늘 <b class="num">${today} XP</b></span><span class="muted small num">다음 레벨까지 ${hi - xp} XP</span></div>
            <div class="track"><i style="width:${pct(xp - lo, hi - lo)}%"></i></div>
            <div class="meter-note num">누적 ${xp} XP · 배지 ${Object.keys(A.S.badges).length}/${A.BADGES.length}</div>
          </div>
        </div>
      </section>`;
  }
  const xpPop = (n) => (n > 0 ? `<span class="xp-pop num" aria-hidden="true">+${n} XP</span>` : '');
  const comboChip = (n, fx) => (n >= 2 ? `<span class="combo${fx ? ' bump' : ''} num">콤보 ${n}</span>` : '');

  /* ---------- 홈 ---------- */
  function vHome() {
    const S = A.S; const t = A.ymd(); const d = A.dayView(t); const g = S.settings;
    const streak = A.streakNow(); const due = A.dueCount();
    const wrongN = Object.keys(S.wrong.w).length + Object.keys(S.wrong.q).length;
    let label = '단어 카드로 시작', act = 'start-cards';
    if (d.w >= g.goalW && d.q < g.goalQ) { label = '문제 풀이로 이어가기'; act = 'start-quiz'; }
    else if (d.w >= g.goalW && d.q >= g.goalQ) { if (wrongN) { label = '오답 복습하기'; act = 'go-notes'; } else { label = '단어 카드 더 하기'; } }
    else if (d.w > 0) label = '단어 카드 이어서 하기';
    const streakLine = d.g ? '오늘 목표 완료! お疲れさま' : streak > 0 ? `오늘도 다 채우면 연속 ${streak + 1}일이 돼요` : '다 채우면 연속 1일이 시작돼요';
    const [hiJ, hiK] = greeting();
    const run = S.run ? `<div class="notice"><div><b>풀던 ${S.run.kind === 'full' ? '실전' : '미니'} 모의고사가 있어요</b><br><span class="muted">${S.run.brk ? '쉬는 시간이에요' : `남은 시간 <span class="run-left num">${mmss(S.run.deadline - Date.now())}</span>`}</span></div><button class="btn sm" data-act="resume-mock">이어서 풀기</button></div>` : '';
    return `
      <section class="hero">
        <p class="hello"><span class="jp">${hiJ}</span>${hiK}</p>
        <div class="dday num">${ddayText()}</div>
        <p class="exam">JLPT N5 · ${examLabel()} 시험</p>
        <button type="button" class="hero-link" data-act="go-guide">시험 안내 보기 ›</button>
      </section>
      ${run}
      ${levelPanel()}
      ${A.ui && A.ui.homeExtra ? A.ui.homeExtra() : ''}
      <section class="panel">
        <div class="panel-head"><h2>오늘 목표</h2><span class="chip">연속 ${streak}일</span></div>
        <p class="muted small">${streakLine}</p>
        ${meter('단어', d.w, g.goalW, '개')}
        ${meter('문제', d.q, g.goalQ, '문제')}
        <button class="btn primary wide" data-act="${act}">${label}</button>
      </section>
      <section class="facts">
        <button class="fact" data-act="start-cards"><span class="num big">${due}</span><span>오늘 복습할 단어</span></button>
        <button class="fact" data-act="go-notes"><span class="num big">${wrongN}</span><span>오답노트</span></button>
        <button class="fact" data-act="go-mock"><span class="num big">${S.mocks.length ? `${S.mocks[0].c}/${S.mocks[0].n}` : '-'}</span><span>최근 모의고사</span></button>
      </section>
      <section class="links">
        <button type="button" class="link-row" data-kana="open"><span class="lr-ico jp" aria-hidden="true">あア</span><span class="lr-main"><b>히라가나·가타카나 표</b><span class="muted small">눌러서 발음 듣기, 가나 퀴즈</span></span><span aria-hidden="true">›</span></button>
        ${hasManifest() && !standalone() ? '<button type="button" class="link-row" data-act="install"><span class="lr-ico" aria-hidden="true">＋</span><span class="lr-main"><b>홈 화면에 앱 추가</b><span class="muted small">아이콘으로 바로 열고, 인터넷 없이도 공부해요</span></span><span aria-hidden="true">›</span></button>' : ''}
        <button type="button" class="link-row" data-act="go-guide"><span class="lr-ico" aria-hidden="true">N5</span><span class="lr-main"><b>JLPT N5 시험 안내</b><span class="muted small">시험 구성, 합격 기준, 시험 당일 준비</span></span><span aria-hidden="true">›</span></button>
      </section>`;
  }

  /* ---------- JLPT 안내 (공식 정보: jlpt.jp 2026-10-05 확인) ---------- */
  function vGuide() {
    const d = A.diffDays(A.ymd(), A.S.settings.examDate);
    const sec = (title, time, rows) => `<div class="exam-part"><div class="ep-head"><b>${title}</b><span class="chip">${time}</span></div><ul class="acc">${rows.map(([k, n]) => `<li><span>${k}</span><span class="num">${n}문항</span><span></span></li>`).join('')}</ul></div>`;
    const link = (href, label) => `<a class="ext" href="${href}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
    return `
