      return `<ul class="acc">${r.secs.map(([c, n], k) => `<li><span>${esc(A.FULL_PLAN[k].name)}</span><span class="num">${c} / ${n}</span><span class="muted num">${pct(c, n)}%</span></li>`).join('')}</ul>
        <div class="exam-sum"><p><b>득점 구분으로 묶으면</b></p><p class="num">언어지식·독해 ${lc} / ${ln} (${pct(lc, ln)}%) · 청해 ${s3[0]} / ${s3[1]} (${pct(s3[0], s3[1])}%)</p>
        <p class="muted small">실제 시험은 언어지식·독해 0~120점, 청해 0~60점의 척도 점수라서 정답 비율로 바로 바꿀 수 없어요. 합격하려면 총점 80점 이상, 그리고 기준점(38점·19점)을 넘어야 해요. 두 구분 모두 고르게 맞히는 연습이 중요해요.</p></div>`;
    })() : '';
    const items = r.items.map(([id, my, ok], k) => {
      const q = A.QMAP.get(id);
      return `<details class="ritem"><summary><span class="okmark">${ok ? '○' : '×'}</span><span class="num">${k + 1}.</span> ${A.QT[q.t]} <span class="jp muted">${esc(plain(q.q).slice(0, 40))}</span></summary>
        ${questionBlock(q, true)}
        <p>내 답: ${my === null ? '<b>답하지 않음</b>' : `<span class="jp">${esc(my)}</span>`}</p>
        <p>정답: <b class="jp">${esc(q.o[0])}</b></p>
        <p class="muted">${esc(q.e)}</p></details>`;
    }).join('');
    const when = new Date(r.at);
    return `<section class="panel">
        <h2>${r.set ? `제${setNo(r.set)}회 실전` : full ? '실전' : '미니'} 모의고사 결과</h2>
        <p class="muted small">${when.getMonth() + 1}월 ${when.getDate()}일 ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}${r.auto ? ' · 시간이 끝나 자동 제출' : ''}</p>
        <p class="score num">${r.c} / ${r.n} <span class="muted small">(${pct(r.c, r.n)}%)</span></p>
        ${r.xp ? `<p class="xp-earned num">+${r.xp} XP</p>` : ''}
        ${secHtml}
        <details class="tr"${full ? '' : ' open'}><summary>유형별 정답 수</summary><ul class="acc">${by}</ul></details>
        <p class="muted small">틀린 문항과 답하지 않은 문항은 오답노트에 모아 뒀어요. 문항을 누르면 해설이 열려요.</p>
      </section>
      <section class="panel">${items}</section>
      <div class="stack"><button class="btn primary wide" data-tab="notes">오답노트로</button><button class="btn ghost wide" data-tab="quiz">문제 탭으로</button></div>`;
  }

  /* ---------- 오답노트 ---------- */
  function vNotes() {
    const S = A.S;
    const ws = Object.entries(S.wrong.w).sort((a, b) => b[1].n - a[1].n);
    const qs = Object.entries(S.wrong.q).sort((a, b) => b[1].n - a[1].n);
    const wl = ws.map(([id, v]) => { const w = A.WMAP.get(id); return `<li><div class="li-main">${jp(w.w)} <span class="muted">${w.r !== w.w ? esc(w.r) + ' · ' : ''}${esc(w.m)}</span></div><span class="num cnt">×${v.n}</span><button class="del" data-act="del-w" data-id="${id}" aria-label="${esc(w.w)} 지우기">지우기</button></li>`; }).join('');
    const ql = qs.map(([id, v]) => { const q = A.QMAP.get(id); return `<li><div class="li-main"><span class="tag">${A.QT[q.t]}</span> <span class="jp">${esc(plain(q.q))}</span></div><span class="num cnt">×${v.n}</span><button class="del" data-act="del-q" data-id="${id}" aria-label="문제 지우기">지우기</button></li>`; }).join('');
    return `
      <h1 class="title">오답노트</h1>
      <p class="muted small">틀린 단어와 문제가 틀린 횟수와 함께 쌓여요. 다시 풀어서 맞히면 저절로 지워져요.</p>
      <section class="panel">
        <div class="panel-head"><h2>단어 <span class="num">${ws.length}</span></h2>${ws.length ? '<button class="btn sm primary" data-act="retry-words">다시 풀기</button>' : ''}</div>
        ${ws.length ? `<ul class="notes">${wl}</ul>` : '<p class="muted">틀린 단어가 없어요. 카드를 "모름"으로 넘기거나 테스트에서 틀리면 여기에 모여요.</p>'}
      </section>
      <section class="panel">
        <div class="panel-head"><h2>문제 <span class="num">${qs.length}</span></h2>${qs.length ? '<button class="btn sm primary" data-act="retry-qs">다시 풀기</button>' : ''}</div>
        ${qs.length ? `<ul class="notes">${ql}</ul>` : '<p class="muted">틀린 문제가 없어요.</p>'}
      </section>`;
  }

  /* ---------- 기록·설정 ---------- */
  function chart() {
    const t = A.ymd(); const days = []; for (let k = 6; k >= 0; k--) days.push(A.addDays(t, -k));
    const vals = days.map((d) => A.dayView(d));
    const g = A.S.settings;
    const max = Math.max(1, g.goalW, g.goalQ, ...vals.map((v) => Math.max(v.w, v.q)));
    const W = 336, H = 172, top = 22, base = 136, gw = W / 7, bw = 13, gap = 2;
    const y = (v) => base - ((base - top) * v) / max;
    let bars = '';
    vals.forEach((v, k) => {
      const cx = gw * k + gw / 2; const d = days[k]; const [yy, mm, dd] = d.split('-').map(Number);
      const lab = d === t ? '오늘' : DOW[new Date(yy, mm - 1, dd).getDay()];
      const x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
      const h1 = base - y(v.w), h2 = base - y(v.q);
      bars += `<g><title>${mm}/${dd} 단어 ${v.w}개 · 문제 ${v.q}문제${v.g ? ' · 목표 달성' : ''}</title>
        <rect class="hit" x="${cx - gw / 2 + 2}" y="${top - 18}" width="${gw - 4}" height="${base - top + 18}"></rect>
        ${v.w ? `<rect class="b-w" x="${x1}" y="${y(v.w)}" width="${bw}" height="${h1}" rx="3"></rect>` : ''}
        ${v.q ? `<rect class="b-q" x="${x2}" y="${y(v.q)}" width="${bw}" height="${h2}" rx="3"></rect>` : ''}
        ${v.w ? `<text class="val" x="${x1 + bw / 2}" y="${y(v.w) - 4}">${v.w}</text>` : ''}
        ${v.q ? `<text class="val" x="${x2 + bw / 2}" y="${y(v.q) - 4}">${v.q}</text>` : ''}
        <text class="lab${d === t ? ' today' : ''}" x="${cx}" y="${base + 16}">${lab}</text>
        ${v.g ? `<text class="lab" x="${cx}" y="${base + 31}">✓</text>` : ''}</g>`;
    });
    return `<div class="legend"><span><i class="lg-w"></i>단어</span><span><i class="lg-q"></i>문제</span><span>✓ 목표 달성</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 학습량">
        <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect class="hatch-bg" width="5" height="5"></rect><rect class="hatch-ln" width="2.2" height="5"></rect></pattern></defs>
        <line class="axis" x1="0" x2="${W}" y1="${base}" y2="${base}"></line>${bars}</svg>`;
  }
  function weekXP() { const t = A.ymd(); let n = 0; for (let k = 0; k < 7; k++) n += A.dayView(A.addDays(t, -k)).x || 0; return n; }
  function xpChart() {
    const t = A.ymd(); const days = []; for (let k = 6; k >= 0; k--) days.push(A.addDays(t, -k));
    const vals = days.map((d) => A.dayView(d).x || 0);
    const max = Math.max(20, ...vals);
    const W = 336, H = 120, top = 18, base = 92, gw = W / 7, bw = 22;
    const y = (v) => base - ((base - top) * v) / max;
    const bars = vals.map((v, k) => {
      const cx = gw * k + gw / 2; const d = days[k]; const [yy, mm, dd] = d.split('-').map(Number);
      const lab = d === t ? '오늘' : DOW[new Date(yy, mm - 1, dd).getDay()];
      return `<g><title>${mm}/${dd} ${v} XP</title>${v ? `<rect class="b-x" x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${base - y(v)}" rx="5"></rect><text x="${cx}" y="${y(v) - 4}">${v}</text>` : ''}<text class="lab${d === t ? ' today' : ''}" x="${cx}" y="${base + 16}">${lab}</text></g>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 XP"><line class="axis" x1="0" x2="${W}" y1="${base}" y2="${base}"></line>${bars}</svg>`;
  }
  function badgeGrid() {
    return `<ul class="badges">${A.BADGES.map((b) => { const at = A.S.badges[b.id]; return `<li class="badge${at ? ' got' : ''}"><span class="bd-ico" aria-hidden="true">${at ? '★' : '☆'}</span><b>${esc(b.name)}</b><span class="muted small">${at ? `${Number(at.slice(5, 7))}/${Number(at.slice(8))} 획득` : esc(b.desc)}</span><span class="sr-only">${at ? '획득함' : '아직 못 얻음'}</span></li>`; }).join('')}</ul>`;
  }
  function vStats() {
    const S = A.S; const t = A.ymd(); const d = A.dayView(t); const g = S.settings;
    const studyDays = Object.values(S.days).filter((v) => v.w || v.q || v.t).length;
    const wrongN = Object.keys(S.wrong.w).length + Object.keys(S.wrong.q).length;
    const answered = d.q + d.t; const correct = d.qc + d.tc;
    const xpAll = A.totalXP();
    const tiles = [
      ['레벨', `Lv ${A.levelOf(xpAll)}`], ['누적 XP', `${xpAll} XP`],
      ['오늘 학습한 단어', `${d.w}개`], ['오늘 푼 문제', `${d.q}문제`],
      ['오늘 정답률', answered ? `${pct(correct, answered)}%` : '-'], ['연속 달성', `${A.streakNow()}일 (최장 ${S.streak.best}일)`],
      ['학습한 날', `${studyDays}일`], ['익힌 단어', `${A.learnedCount()} / ${A.WORDS.length}`], ['오답', `${wrongN}개`]
    ].map(([k, v]) => `<div class="tile"><span class="muted small">${k}</span><b class="num">${v}</b></div>`).join('');
    const mocks = S.mocks.slice(0, 5).map((m, k) => { const dt = new Date(m.at); return `<li><span>${dt.getMonth() + 1}/${dt.getDate()} ${m.set ? `제${setNo(m.set)}회` : m.kind === 'full' ? '실전' : '미니'}</span><span class="num">${m.c} / ${m.n}</span><span class="num muted">${pct(m.c, m.n)}%</span>${k === 0 ? '<button class="del" data-act="show-last-mock">보기</button>' : '<span></span>'}</li>`; }).join('');
    const reset = resetAsk
      ? `<div class="confirm"><p>단어 진도, 문제 기록, 오답노트, 연속 달성, 모의고사 기록이 모두 지워져요. 시험일과 목표 설정은 남아요.</p><div class="row2"><button class="btn" data-act="reset-no">취소</button><button class="btn danger" data-act="reset-yes">모두 지우기</button></div></div>`
      : `<button class="btn ghost wide" data-act="reset-ask">기록 초기화</button>`;
    const mode = A.Sync.mode;
    return `
      <h1 class="title">기록</h1>
      <section class="tiles">${tiles}</section>
      <section class="panel"><h2>최근 7일</h2>${chart()}</section>
      <section class="panel"><div class="panel-head"><h2>최근 7일 XP</h2><span class="chip num">${weekXP()} XP</span></div>${xpChart()}</section>
      <section class="panel"><div class="panel-head"><h2>배지</h2><span class="chip num">${Object.keys(S.badges).length} / ${A.BADGES.length}</span></div>${badgeGrid()}</section>
      ${S.mocks.length ? `<section class="panel"><h2>모의고사 기록</h2><ul class="acc mocks">${mocks}</ul></section>` : ''}
      ${installPanel()}
      <section class="panel">
        <h2>화면</h2>
        <div class="seg" role="group" aria-label="화면 밝기">${THEMES.map(([k, l]) => `<button type="button" class="chip-btn${themePref === k ? ' on' : ''}" data-act="theme" data-t="${k}" aria-pressed="${themePref === k}">${themePref === k ? '● ' : ''}${l}</button>`).join('')}</div>
        <div class="seg two" role="group" aria-label="발음 속도">${[['slow', '발음 천천히'], ['normal', '발음 보통']].map(([k, l]) => { const on = (k === 'slow') === voiceSlow; return `<button type="button" class="chip-btn${on ? ' on' : ''}" data-act="voice-rate" data-v="${k}" aria-pressed="${on}">${on ? '● ' : ''}${l}</button>`; }).join('')}</div>
        <div class="seg two" role="group" aria-label="효과음">${[['on', '효과음 켜기'], ['off', '효과음 끄기']].map(([k, l]) => { const on = (k === 'on') === soundOn; return `<button type="button" class="chip-btn${on ? ' on' : ''}" data-act="sound" data-v="${k}" aria-pressed="${on}">${on ? '● ' : ''}${l}</button>`; }).join('')}</div>
        <p class="muted small">"기기 설정"은 휴대폰의 다크 모드 설정을 따라가요. 위쪽 달·해 버튼으로도 바로 바꿀 수 있고, 이 설정은 이 기기에만 저장돼요.</p>
      </section>
      <section class="panel">
        <h2>설정</h2>
        <form id="settings" class="form" novalidate>
          <label for="set-exam">시험일</label>
          <input id="set-exam" name="exam" type="date" value="${esc(g.examDate)}" required>
          <label for="set-gw">하루 단어 목표 (5~100개)</label>
          <input id="set-gw" name="gw" type="number" inputmode="numeric" min="5" max="100" step="1" value="${g.goalW}" required>
          <label for="set-gq">하루 문제 목표 (5~50문제)</label>
          <input id="set-gq" name="gq" type="number" inputmode="numeric" min="5" max="50" step="1" value="${g.goalQ}" required>
          <p class="muted small">오늘 목표를 아직 못 채웠다면 바뀐 목표가 오늘부터 적용돼요.</p>
          <button class="btn primary wide" type="submit">저장</button>
          <p class="form-msg" role="status">${esc(settingsMsg)}</p>
        </form>
      </section>
      <section class="panel">
        <h2>저장 위치</h2>
        <p class="small">${mode === 'cloud' ? '기록은 이 화면을 연 Claude 계정에 저장돼요. 다른 기기에서 같은 링크를 열어도 이어서 학습할 수 있고, 다른 사람에게는 보이지 않아요.' : mode === 'full' ? '계정 저장 공간이 가득 차서 이 기기에만 저장하고 있어요.' : '기록은 이 휴대폰의 이 브라우저에만 저장돼요. 다른 기기나 다른 브라우저와는 이어지지 않고, 브라우저 데이터를 지우면 기록도 사라져요.'}</p>
        ${reset}
      </section>`;
  }

  const VIEWS = { home: vHome, words: vWords, cards: vCards, cardsDone: vCardsDone, test: vTest, testDone: vTestDone, quiz: vQuiz, qsess: vQsess, qdone: vQdone, mock: vMock, mockres: vMockres, notes: vNotes, stats: vStats, guide: vGuide, dict: vDict, mocklist: vMockList };

  /* ---------- 렌더 ---------- */
  function renderChrome() {
    document.getElementById('hdr-dday').textContent = ddayText();
    const sync = document.getElementById('hdr-sync'); if (sync) sync.textContent = syncText(A.Sync.mode);
    const tab = tabFor(view);
    document.querySelectorAll('.tabs [data-tab]').forEach((b) => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  }
  /* anim: 'fade' 화면 전환, 'next' 다음 문항(오른쪽에서 들어옴), 'prev' 이전 문항 */
  function render(keepScroll, anim) {
    A.today();
    renderChrome();
    $view.style.transition = '';
    $view.style.transform = '';
    $view.innerHTML = (VIEWS[view] || vHome)();
    if (!keepScroll) $main.scrollTop = 0;
    const lc = currentListen();
    if (lc && lc.it && !lc.it.played && jaReady()) { lc.it.played = true; playCurrent(); }
    else if (lc && !lc.it && A.S.run && !A.S.run.brk) { const mid = A.S.run.ids[A.S.run.i]; if (!mockPlayed.has(mid) && jaReady()) { mockPlayed.add(mid); playCurrent(); } }
    if (anim && !reduced()) {
      $view.classList.remove('a-fade', 'a-next', 'a-prev');
      void $view.offsetWidth;
      $view.classList.add('a-' + anim);
    }
  }
  function go(v) { if (lsPlaying) stopListening(); view = v; submitAsk = false; resetAsk = false; render(false, 'fade'); }
  function commit() {
    A.save();
    announce();
  }
  /* 목표 달성 축하, 레벨 업, 새 배지를 차례로 알린다 */
  function announce() {
    if (A.celebrate) { A.celebrate = false; showCelebrate(); }
    const got = A.checkBadges();
    if (got.length) A.save();
    if (A.levelUpTo) { const L = A.levelUpTo; A.levelUpTo = 0; banner(`레벨 업! 이제 Lv ${L}이에요`, 'level'); }
    got.forEach((b) => banner(`배지 획득 · ${b.name}`, 'badge'));
  }
  const bannerQ = []; let bannerOn = false;
  function banner(text, kind) { bannerQ.push([text, kind]); if (!bannerOn) nextBanner(); }
  function nextBanner() {
    const el = document.getElementById('banner');
    const item = bannerQ.shift();
    if (!el || !item) { bannerOn = false; if (el) el.hidden = true; return; }
    bannerOn = true;
    el.className = 'banner ' + item[1];
    el.innerHTML = `<span class="b-ico" aria-hidden="true">${item[1] === 'level' ? '▲' : '★'}</span><span>${esc(item[0])}</span>`;
    el.hidden = false;
    sfx(item[1]);
    setTimeout(nextBanner, 2400);
  }
  A.announce = announce;

  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }
  function closeOverlay() { $overlay.hidden = true; $overlay.innerHTML = ''; }
  function showCelebrate() {
    const d = A.dayView(A.ymd());
    const bits = reduced() ? '' : Array.from({ length: 24 }, (_, k) =>
      `<i class="bit s${k % 3}" style="left:${(k * 4.1 + Math.random() * 3).toFixed(1)}%;animation-delay:${(Math.random() * 0.6).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.4).toFixed(2)}s"></i>`).join('');
    $overlay.innerHTML = `<div class="confetti" aria-hidden="true">${bits}</div>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cel-t">
        <div class="done-mark" aria-hidden="true">✓</div>
        <h2 id="cel-t">오늘 목표를 채웠어요</h2>
        <p class="jp muted">お疲れさまでした</p>
        <p class="streak-big num">연속 ${A.streakNow()}일</p>
        <p class="muted">단어 ${d.w}개 · 문제 ${d.q}문제 · 보너스 +10 XP</p>
        <button class="btn primary wide" data-act="close-overlay">계속하기</button>
      </div>`;
    $overlay.hidden = false;
    sfx('done');
    buzz([15, 50, 15]);
    const b = $overlay.querySelector('button'); if (b) b.focus();
  }

  /* ---------- 세션 시작 ---------- */
  function startCards(topic) {
    const ids = A.buildCards(10, topic || null);
    if (!ids.length) { toast('넘길 카드가 없어요.'); return; }
    X = { kind: 'cards', ids, i: 0, flip: false, k: 0, u: 0, xp: 0, topic: topic || null, from: 'words', anim: 'card-in' }; go('cards');
  }
  function startTest(ids, retry) {
    const list = ids && ids.length ? ids : A.buildTestIds(10);
    X = { kind: 'test', items: A.makeTest(list), i: 0, c: 0, xp: 0, combo: 0, best: 0, retry: !!retry, from: retry ? 'notes' : 'words' };
    go('test');
  }
  function startQuiz(retry) {
    const items = retry ? A.buildQuiz('all', 10, Object.keys(A.S.wrong.q)) : A.buildQuiz(quizType, 10);
    if (!items.length) { toast('풀 문제가 없어요.'); return; }
    X = { kind: 'quiz', items, i: 0, c: 0, xp: 0, combo: 0, best: 0, retry: !!retry, from: retry ? 'notes' : 'quiz' };
    go('qsess');
  }

  /* 정답 처리 공통: 콤보를 세고 5콤보마다 보너스 +5 XP */
  function scoreAnswer(it, ok, xp) {
    it.fx = true;
    it.xp = xp;
    if (ok) {
      X.combo = (X.combo || 0) + 1;
      X.best = Math.max(X.best || 0, X.combo);
      if (X.combo % 5 === 0) { const b = A.addXP(5); it.xp += b; toast(`${X.combo}콤보! 보너스 +${b} XP`); sfx('combo'); } else sfx('ok');
    } else { X.combo = 0; sfx('bad'); }
    X.xp += it.xp;
    buzz(ok ? 12 : [10, 60, 10]);
  }

  /* ---------- 카드 넘기기: 왼쪽 = 알아요, 오른쪽 = 모름 ---------- */
  function flyCard(known) {
    if (busy || !X || X.kind !== 'cards') return;
    const sess = X;
    sess.xp += A.gradeCard(sess.ids[sess.i], known);
    if (known) sess.k++; else sess.u++;
    sfx('card');
    buzz(8);
    commit();
    const next = () => {
      busy = false;
      if (X !== sess || view !== 'cards') return;
      if (sess.i + 1 < sess.ids.length) { sess.i++; sess.flip = false; sess.anim = 'card-in'; render(); } else go('cardsDone');
    };
    const el = $view.querySelector('.card');
    if (!el || reduced()) { next(); return; }
    busy = true;
    const dir = known ? -1 : 1; const w = el.offsetWidth || 320;
    el.classList.remove('card-in', 'flip-in', 'dragging');
    el.style.setProperty('--know', known ? '1' : '0');
    el.style.setProperty('--dont', known ? '0' : '1');
    void el.offsetWidth;
    el.style.transition = 'transform 0.26s cubic-bezier(0.4, 0, 0.8, 0.6), opacity 0.26s ease-in';
    el.style.transform = `translateX(${dir * (w + 80)}px) rotate(${dir * 14}deg)`;
    el.style.opacity = '0';
    setTimeout(next, 240);
  }
  function springBack(el) {
    el.classList.remove('dragging');
    el.style.transition = 'transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.25)';
    el.style.transform = '';
    el.style.setProperty('--know', '0');
    el.style.setProperty('--dont', '0');
    setTimeout(() => { el.style.transition = ''; }, 300);
  }

  /* ---------- 문항 화면 밀기: 왼쪽 = 다음, 오른쪽 = 이전(모의고사) ---------- */
  function pageAllow() {
    if (view === 'test' && X && X.kind === 'test') { const it = X.items[X.i]; return { left: !!it && it.picked !== null, right: false }; }
    if (view === 'qsess' && X && X.kind === 'quiz') { const it = X.items[X.i]; return { left: !!it && it.done, right: false }; }
    if (view === 'mock' && A.S.run && !A.S.run.brk) { const run = A.S.run; const [from, to] = run.secs[run.si]; return { left: run.i < to - 1, right: run.i > from }; }
    return { left: false, right: false };
  }
  function pageSwipe(dir) {
    if (view === 'test') handlers['test-next']();
    else if (view === 'qsess') handlers['q-next']();
    else if (view === 'mock') handlers[dir === 'left' ? 'm-next' : 'm-prev']();
  }

  let drag = null;
  let swallowClick = false;
  let press = null;        /* 넘길 수 없는 화면에서 밀었을 때도 보기가 눌리지 않게 한다 */
  document.addEventListener('pointerdown', (e) => {
    swallowClick = false;
    drag = null;
    press = e.isPrimary ? { id: e.pointerId, x0: e.clientX, y0: e.clientY } : null;
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0) || busy || !$overlay.hidden) return;
    const base = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: e.timeStamp, dx: 0, on: false };
    const card = view === 'cards' && X && X.kind === 'cards' ? e.target.closest('.card[data-swipe]') : null;
    if (card) { drag = Object.assign(base, { kind: 'card', el: card }); return; }
    if (!$main.contains(e.target) || e.target.closest('input, select, textarea')) return;
    const allow = pageAllow();
    if (allow.left || allow.right) drag = Object.assign(base, { kind: 'page', allow });
  });
  document.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.on) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) >= Math.abs(dx)) { drag = null; return; } /* 세로 스크롤은 브라우저에 맡긴다 */
      drag.on = true;
      if (drag.kind === 'card') {
        drag.el.classList.remove('card-in', 'flip-in');
        drag.el.classList.add('dragging');
        try { drag.el.setPointerCapture(e.pointerId); } catch (err) { /* 캡처를 못 쓰는 브라우저 */ }
      }
    }
    drag.dx = dx;
    if (drag.kind === 'card') {
      const w = drag.el.offsetWidth || 320; const p = Math.max(-1, Math.min(1, dx / (w * 0.3)));
      drag.el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      drag.el.style.setProperty('--know', String(Math.max(0, -p)));
      drag.el.style.setProperty('--dont', String(Math.max(0, p)));
    } else {
      const ok = dx < 0 ? drag.allow.left : drag.allow.right;
      $view.style.transform = `translateX(${dx * (ok ? 0.3 : 0.06)}px)`;
    }
  });
  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.on) return;
    swallowClick = true; /* 끌기 직후 따라오는 click은 버린다 */
    const fast = Math.abs(d.dx) > 40 && Math.abs(d.dx) / Math.max(1, e.timeStamp - d.t0) > 0.5;
    if (d.kind === 'card') {
      const w = d.el.offsetWidth || 320;
      if (!cancelled && (Math.abs(d.dx) > w * 0.28 || fast)) flyCard(d.dx < 0); else springBack(d.el);
      return;
    }
    const dir = d.dx < 0 ? 'left' : 'right';
    if (!cancelled && d.allow[dir] && (Math.abs(d.dx) > 60 || fast)) { buzz(6); pageSwipe(dir); return; }
    $view.style.transition = 'transform 0.2s ease-out';
    $view.style.transform = '';
    setTimeout(() => { $view.style.transition = ''; }, 220);
  }
  document.addEventListener('pointerup', (e) => {
    if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > 12) swallowClick = true;
    press = null;
    endDrag(e, false);
  });
  document.addEventListener('pointercancel', (e) => endDrag(e, true));
  document.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

  /* ---------- 입력 ---------- */
  const handlers = {
    'start-cards': () => startCards(null),
    'more-cards': () => startCards(X && X.topic),
    'start-topic': (el) => { if (A.TOPIC_NAME[el.dataset.t]) startCards(el.dataset.t); },
    'go-dict': () => { X = null; go('dict'); },
    'dict-topic': (el) => { dictTopic = el.dataset.t === 'all' || A.TOPIC_NAME[el.dataset.t] ? el.dataset.t : 'all'; render(true); },
    'start-test': () => { if (X && X.kind === 'cards') startTest(X.ids.slice(), false); else startTest(null, false); },
    'start-quiz': () => startQuiz(false),
    'go-notes': () => { X = null; go('notes'); },
    'go-guide': () => { X = null; go('guide'); },
    'go-mock': () => { X = null; go(A.S.mocks.length && !A.S.run ? 'mockres' : 'quiz'); },
    flip: () => { if (X && X.kind === 'cards' && !X.flip && !busy) { X.flip = true; X.anim = 'flip-in'; render(true); } },
    'card-yes': () => flyCard(true),
    'card-no': () => flyCard(false),
    'test-pick': (el) => {
      const it = X.items[X.i]; if (it.picked !== null) return;
      it.picked = Number(el.dataset.k);
      const ok = it.opts[it.picked] === it.ans; if (ok) X.c++;
      scoreAnswer(it, ok, A.answerTest(it.id, ok)); commit(); render(true);
    },
    'test-next': () => { if (X.i + 1 < X.items.length) { X.i++; render(false, 'next'); } else go('testDone'); },
    qtype: (el) => { quizType = el.dataset.t; render(true); },
    'q-pick': (el) => { const it = X.items[X.i]; if (it.done) return; it.picked = Number(el.dataset.k); render(true); },
    'q-check': () => {
      const it = X.items[X.i]; const q = A.QMAP.get(it.id);
      let ok;
      if (q.t === 'so' && it.tiles) { if (it.done || it.order.length !== 4) return; ok = it.order.every((ti, k) => it.tiles[ti] === q.parts[k]); }
      else { if (it.done || it.picked === null) return; ok = it.opts[it.picked] === q.o[0]; }
      it.done = true; it.ok = ok; if (ok) X.c++;
      scoreAnswer(it, ok, A.answerQ(it.id, ok)); commit(); render(true);
    },
    'so-tile': (el) => { const it = X && X.items[X.i]; if (!it || !it.tiles || it.done || it.order.length >= 4) return; const k = Number(el.dataset.k); if (!it.order.includes(k)) { it.order.push(k); sfx('card'); render(true); } },
    'so-slot': (el) => { const it = X && X.items[X.i]; if (!it || !it.tiles || it.done) return; const k = Number(el.dataset.k); if (k < it.order.length) { it.order.splice(k, 1); render(true); } },
    'l-play': () => { if (lsPlaying) stopListening(); else playCurrent(); },
    'l-slow': () => { lsSlow = !lsSlow; render(true); },
    'so-clear': () => { const it = X && X.items[X.i]; if (!it || !it.tiles || it.done) return; it.order = []; render(true); },
    'q-next': () => { if (X.i + 1 < X.items.length) { X.i++; render(false, 'next'); } else go('qdone'); },
    'start-mock': (el) => { A.startMock(el.dataset.kind === 'full' ? 'full' : 'mini'); mockPlayed.clear(); X = null; go('mock'); },
    'go-mocklist': () => { X = null; go('mocklist'); },
    'start-set': (el) => { if (A.S.run) { toast('풀던 모의고사를 먼저 끝내 주세요.'); return; } if (A.startMock('set', el.dataset.id)) { mockPlayed.clear(); X = null; go('mock'); } },
    'm-start-sec': () => { A.startSection(); submitAsk = false; render(false, 'fade'); },
    'resume-mock': () => { X = null; go(A.S.run ? 'mock' : 'quiz'); },
    'm-pick': (el) => { const run = A.S.run; if (!run || run.brk) return; const id = run.ids[run.i]; run.ans[id] = run.opts[id][Number(el.dataset.k)]; A.save(); render(true); },
    'm-prev': () => { const run = A.S.run; if (run && !run.brk && run.i > run.secs[run.si][0]) { run.i--; A.save(); render(false, 'prev'); } },
    'm-next': () => { const run = A.S.run; if (run && !run.brk && run.i < run.secs[run.si][1] - 1) { run.i++; A.save(); render(false, 'next'); } },
    'm-go': (el) => {
      const run = A.S.run; if (!run) return;
      if (run.brk) return;
      const to = A.clampInt(el.dataset.i, run.secs[run.si][0], run.secs[run.si][1] - 1, run.secs[run.si][0]);
      if (to === run.i) return;
      const anim = to > run.i ? 'next' : 'prev';
      run.i = to; A.save(); render(false, anim);
    },
    'm-submit': () => { submitAsk = true; render(true); },
    'm-submit-no': () => { submitAsk = false; render(true); },
    'm-submit-yes': () => {
      submitAsk = false;
      const res = A.submitSection(false);
      if (res) { lastMock = res; sfx('done'); announce(); go('mockres'); }
      else { if (lsPlaying) stopListening(); sfx('ok'); render(false, 'fade'); }
    },
    'show-last-mock': () => { lastMock = A.S.mocks[0] || null; X = null; go('mockres'); },
    'retry-words': () => { const ids = Object.entries(A.S.wrong.w).sort((a, b) => b[1].n - a[1].n).slice(0, 10).map(([id]) => id); if (!ids.length) { toast('틀린 단어가 없어요.'); go('notes'); return; } startTest(ids, true); },
    'retry-qs': () => { if (!Object.keys(A.S.wrong.q).length) { toast('틀린 문제가 없어요.'); go('notes'); return; } startQuiz(true); },
    'del-w': (el) => { delete A.S.wrong.w[el.dataset.id]; A.save(); render(true); },
    'del-q': (el) => { delete A.S.wrong.q[el.dataset.id]; A.save(); render(true); },
    'reset-ask': () => { resetAsk = true; render(true); },
    'reset-no': () => { resetAsk = false; render(true); },
    'reset-yes': () => { A.resetAll(); resetAsk = false; X = null; lastMock = null; toast('기록을 모두 지웠어요.'); render(true); },
    install: async () => {
      if (installPrompt) {
        const p = installPrompt; installPrompt = null;
        try { p.prompt(); await p.userChoice; } catch (e) { /* 설치 창을 띄우지 못함 */ }
        render(true); return;
      }
      X = null; go('stats');
      const el = document.getElementById('install-panel'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    },
    'theme-toggle': () => { setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark'); if (view === 'stats') render(true); },
    theme: (el) => { setTheme(el.dataset.t); render(true); },
    'voice-rate': (el) => { setVoiceSlow(el.dataset.v === 'slow'); render(true); speak('あ'); },
    sound: (el) => { setSound(el.dataset.v === 'on'); if (soundOn) sfx('ok'); render(true); },
    speak: (el) => speak(el.dataset.say || ''),
    'close-overlay': closeOverlay
  };
  A.speak = (text) => speak(text);
  A.feedback = (ok) => { sfx(ok ? 'ok' : 'bad'); buzz(ok ? 12 : [10, 60, 10]); };
  /* 발음 속도: 기본은 천천히. 이 기기에만 저장한다 */
  const VOICE_KEY = 'jlpt-n5-voice-rate';
  let voiceSlow = true;
  try { voiceSlow = localStorage.getItem(VOICE_KEY) !== 'normal'; } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  function setVoiceSlow(on) { voiceSlow = !!on; try { localStorage.setItem(VOICE_KEY, voiceSlow ? 'slow' : 'normal'); } catch (e) { /* 이번 접속에서만 적용 */ } }
  /* 한 박자짜리 가나(あ, か, きゃ 등)는 너무 짧게 끝나므로 아주 천천히, 쉬었다가 두 번 읽는다 */
  const isMora = (t) => /^[\u3041-\u3096\u30a1-\u30fa][ぁぃぅぇぉゃゅょァィゥェォャュョ]?$/.test(t);
  function speak(text) {
    if (!canSpeak || !text) return;
    if (!jaReady()) { toast('이 기기에는 일본어 음성이 없어서 소리를 낼 수 없어요.'); return; }
    try {
      window.speechSynthesis.cancel();
      const mora = isMora(text);
      const u = new window.SpeechSynthesisUtterance(mora ? `${text}。　${text}。` : text);
      u.lang = 'ja-JP';
      u.rate = mora ? (voiceSlow ? 0.5 : 0.65) : (voiceSlow ? 0.75 : 0.9);
      const v = window.speechSynthesis.getVoices().find((x) => /^ja/i.test(x.lang));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) { toast('이 기기에서는 발음을 들을 수 없어요.'); }
  }

  document.addEventListener('click', (e) => {
    const tabEl = e.target.closest('[data-tab]');
    if (tabEl) { X = null; busy = false; go(tabEl.dataset.tab); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = handlers[el.dataset.act];
    if (fn) fn(el);
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'dict-q') return;
    dictQuery = e.target.value.slice(0, 40);
    const list = document.getElementById('dict-list'); if (list) list.innerHTML = dictRows();
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'settings') return;
    e.preventDefault();
    const f = e.target;
    const exam = f.exam.value; const gw = Number(f.gw.value); const gq = Number(f.gq.value);
    if (!A.isDate(exam)) { settingsMsg = '시험일을 날짜로 입력해 주세요.'; render(true); return; }
    if (!Number.isInteger(gw) || gw < 5 || gw > 100) { settingsMsg = '하루 단어 목표는 5에서 100 사이로 정해 주세요.'; render(true); return; }
    if (!Number.isInteger(gq) || gq < 5 || gq > 50) { settingsMsg = '하루 문제 목표는 5에서 50 사이로 정해 주세요.'; render(true); return; }
    A.applySettings(exam, gw, gq);
    settingsMsg = '설정을 저장했어요.';
    announce();
    render(true);
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); const fn = handlers[e.target.dataset.act]; if (fn) fn(e.target); return; }
    if (e.key === 'Escape' && !$overlay.hidden) closeOverlay();
  });

  /* ---------- 모의고사 타이머 ---------- */
  setInterval(() => {
    const run = A.S.run;
    if (!run || run.brk) return;
    const left = run.deadline - Date.now();
    if (left <= 0) {
      const res = A.submitSection(true);
      if (res) { lastMock = res; announce(); if (view === 'mock') go('mockres'); else { toast('모의고사 시간이 끝나 자동으로 제출했어요.'); if (!X) render(true); } }
      else { if (lsPlaying) stopListening(); submitAsk = false; toast('시간이 끝나 이 교시를 제출했어요.'); if (view === 'mock') render(); else if (!X) render(true); }
      return;
    }
    const t = document.getElementById('mock-timer'); if (t) t.textContent = mmss(left);
    document.querySelectorAll('.run-left').forEach((s) => { s.textContent = mmss(left); });
  }, 1000);

  A.onSyncMode = () => renderChrome();
  A.onRemote = () => { if (!X && view !== 'mock') render(true); else renderChrome(); };
  /* 다른 파일(path.js)이 화면과 입력을 덧붙일 수 있게 연다 */
  A.ui = {
    go, render, toast, sfx, buzz, esc, pct, qText, commit,
    canJa: () => jaReady(),
    view: () => view,
    addView(name, fn, tab) { VIEWS[name] = fn; TAB_OF[name] = tab; },
    addHandlers(obj) { Object.assign(handlers, obj); },
    qBlock: (q, done) => questionBlock(q, done),
    hideOpt: (q, done) => hideOpt(q, done),
    scriptHtml: (q, open) => scriptHtml(q, open),
    trHtml: (q) => trHtml(q),
    playScript: (q, opts) => playLines(scriptLines(q, opts)),
    stopAudio: () => stopListening(),
    isPlaying: () => lsPlaying,
    homeExtra: null
  };
  applyTheme();
  if (A.checkBadges().length) A.save();
  A.levelUpTo = 0;
  render();
  A.initSync();
})();

</script>
<script>
/* kana.js */
/* 히라가나·가타카나 표. 화면 오른쪽에서 열리는 서랍으로, 어느 화면에서든 열 수 있다.
   글자를 누르면 발음을 들려주고, 가나 퀴즈(10문제, 4지선다)를 풀 수 있다. */
(function () {
  'use strict';
  const A = window.App;
  const esc = A.esc;

  /* [히라가나, 가타카나, 로마자, 한글 발음] · 빈 칸은 null */
  const BASIC = [
    [['あ', 'ア', 'a', '아'], ['い', 'イ', 'i', '이'], ['う', 'ウ', 'u', '우'], ['え', 'エ', 'e', '에'], ['お', 'オ', 'o', '오']],
    [['か', 'カ', 'ka', '카'], ['き', 'キ', 'ki', '키'], ['く', 'ク', 'ku', '쿠'], ['け', 'ケ', 'ke', '케'], ['こ', 'コ', 'ko', '코']],
    [['さ', 'サ', 'sa', '사'], ['し', 'シ', 'shi', '시'], ['す', 'ス', 'su', '스'], ['せ', 'セ', 'se', '세'], ['そ', 'ソ', 'so', '소']],
    [['た', 'タ', 'ta', '타'], ['ち', 'チ', 'chi', '치'], ['つ', 'ツ', 'tsu', '츠'], ['て', 'テ', 'te', '테'], ['と', 'ト', 'to', '토']],
    [['な', 'ナ', 'na', '나'], ['に', 'ニ', 'ni', '니'], ['ぬ', 'ヌ', 'nu', '누'], ['ね', 'ネ', 'ne', '네'], ['の', 'ノ', 'no', '노']],
    [['は', 'ハ', 'ha', '하'], ['ひ', 'ヒ', 'hi', '히'], ['ふ', 'フ', 'fu', '후'], ['へ', 'ヘ', 'he', '헤'], ['ほ', 'ホ', 'ho', '호']],
    [['ま', 'マ', 'ma', '마'], ['み', 'ミ', 'mi', '미'], ['む', 'ム', 'mu', '무'], ['め', 'メ', 'me', '메'], ['も', 'モ', 'mo', '모']],
    [['や', 'ヤ', 'ya', '야'], null, ['ゆ', 'ユ', 'yu', '유'], null, ['よ', 'ヨ', 'yo', '요']],
    [['ら', 'ラ', 'ra', '라'], ['り', 'リ', 'ri', '리'], ['る', 'ル', 'ru', '루'], ['れ', 'レ', 're', '레'], ['ろ', 'ロ', 'ro', '로']],
    [['わ', 'ワ', 'wa', '와'], null, null, null, ['を', 'ヲ', 'wo', '오']],
    [['ん', 'ン', 'n', '응'], null, null, null, null]
  ];
  const DAKU = [
    [['が', 'ガ', 'ga', '가'], ['ぎ', 'ギ', 'gi', '기'], ['ぐ', 'グ', 'gu', '구'], ['げ', 'ゲ', 'ge', '게'], ['ご', 'ゴ', 'go', '고']],
    [['ざ', 'ザ', 'za', '자'], ['じ', 'ジ', 'ji', '지'], ['ず', 'ズ', 'zu', '즈'], ['ぜ', 'ゼ', 'ze', '제'], ['ぞ', 'ゾ', 'zo', '조']],
    [['だ', 'ダ', 'da', '다'], ['ぢ', 'ヂ', 'ji', '지'], ['づ', 'ヅ', 'zu', '즈'], ['で', 'デ', 'de', '데'], ['ど', 'ド', 'do', '도']],
    [['ば', 'バ', 'ba', '바'], ['び', 'ビ', 'bi', '비'], ['ぶ', 'ブ', 'bu', '부'], ['べ', 'ベ', 'be', '베'], ['ぼ', 'ボ', 'bo', '보']],
    [['ぱ', 'パ', 'pa', '파'], ['ぴ', 'ピ', 'pi', '피'], ['ぷ', 'プ', 'pu', '푸'], ['ぺ', 'ペ', 'pe', '페'], ['ぽ', 'ポ', 'po', '포']]
  ];
  const YOON = [
    [['きゃ', 'キャ', 'kya', '캬'], ['きゅ', 'キュ', 'kyu', '큐'], ['きょ', 'キョ', 'kyo', '쿄']],
    [['しゃ', 'シャ', 'sha', '샤'], ['しゅ', 'シュ', 'shu', '슈'], ['しょ', 'ショ', 'sho', '쇼']],
    [['ちゃ', 'チャ', 'cha', '차'], ['ちゅ', 'チュ', 'chu', '추'], ['ちょ', 'チョ', 'cho', '초']],
    [['にゃ', 'ニャ', 'nya', '냐'], ['にゅ', 'ニュ', 'nyu', '뉴'], ['にょ', 'ニョ', 'nyo', '뇨']],
    [['ひゃ', 'ヒャ', 'hya', '햐'], ['ひゅ', 'ヒュ', 'hyu', '휴'], ['ひょ', 'ヒョ', 'hyo', '효']],
    [['みゃ', 'ミャ', 'mya', '먀'], ['みゅ', 'ミュ', 'myu', '뮤'], ['みょ', 'ミョ', 'myo', '묘']],
    [['りゃ', 'リャ', 'rya', '랴'], ['りゅ', 'リュ', 'ryu', '류'], ['りょ', 'リョ', 'ryo', '료']],
    [['ぎゃ', 'ギャ', 'gya', '갸'], ['ぎゅ', 'ギュ', 'gyu', '규'], ['ぎょ', 'ギョ', 'gyo', '교']],
    [['じゃ', 'ジャ', 'ja', '자'], ['じゅ', 'ジュ', 'ju', '주'], ['じょ', 'ジョ', 'jo', '조']],
    [['びゃ', 'ビャ', 'bya', '뱌'], ['びゅ', 'ビュ', 'byu', '뷰'], ['びょ', 'ビョ', 'byo', '뵤']],
    [['ぴゃ', 'ピャ', 'pya', '퍄'], ['ぴゅ', 'ピュ', 'pyu', '퓨'], ['ぴょ', 'ピョ', 'pyo', '표']]
  ];
  /* 외래어를 적을 때 쓰는 가타카나 조합(가타카나 전용) */
  const FOREIGN = [
    [[null, 'ファ', 'fa', '파'], [null, 'フィ', 'fi', '피'], [null, 'フェ', 'fe', '페'], [null, 'フォ', 'fo', '포']],
    [[null, 'ティ', 'ti', '티'], [null, 'ディ', 'di', '디'], [null, 'シェ', 'she', '셰'], [null, 'ジェ', 'je', '제']],
    [[null, 'チェ', 'che', '체'], [null, 'ウィ', 'wi', '위'], [null, 'ウェ', 'we', '웨'], [null, 'ウォ', 'wo', '워']]
  ];
  A.KANA = { BASIC, DAKU, YOON };
  const SETS = { basic: '기본', daku: '탁음·반탁음', yoon: '요음', special: '특수' };

  let script = 'h';          /* h 히라가나 · k 가타카나 */
  let set = 'basic';
  let quiz = null;           /* { items:[{k, r, opts}], i, c, picked } */
  let lastFocus = null;

  const root = document.createElement('div');
  root.className = 'sheet';
  root.id = 'kana-sheet';
  root.setAttribute('aria-hidden', 'true');
  root.innerHTML = '<div class="sheet-backdrop" data-kana="close"></div><aside class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="kana-title"></aside>';
  document.body.appendChild(root);
  const panel = root.querySelector('.sheet-panel');

  const pick = (cell) => (script === 'h' ? cell[0] : cell[1]);
  function cellHtml(cell) {
    if (!cell || !pick(cell)) return '<span class="kcell empty" aria-hidden="true"></span>';
    const k = pick(cell);
    return `<button type="button" class="kcell" data-kana="say" data-say="${esc(k)}" aria-label="${esc(k)} ${esc(cell[2])} 발음 듣기"><span class="k">${esc(k)}</span><span class="r">${esc(cell[2])} · ${esc(cell[3])}</span></button>`;
  }
  function grid(rows, cols) { return `<div class="kana-grid c${cols}">${rows.map((r) => r.map(cellHtml).join('')).join('')}</div>`; }

  function vTable() {
    let body = '';
    if (set === 'basic') body = grid(BASIC, 5) + '<p class="muted small">は는 조사로 쓰일 때 "와(wa)", へ는 조사로 쓰일 때 "에(e)"로 읽어요. を는 "오(o)"로 소리 나고 조사로만 써요.</p>';
    else if (set === 'daku') body = grid(DAKU, 5) + '<p class="muted small">점 두 개(゛)는 탁음, 동그라미(゜)는 반탁음이에요. ぢ·づ는 じ·ず와 소리가 같고 쓰이는 일이 드물어요.</p>';
    else if (set === 'yoon') body = grid(YOON, 3) + '<p class="muted small">い단 글자 뒤에 작은 ゃ·ゅ·ょ를 붙여 한 박자로 읽어요. 예) しゃしん(사진), きょう(오늘)</p>';
    else {
      body = `<div class="kana-notes">
          <div class="kn"><span class="k jp">${script === 'h' ? 'っ' : 'ッ'}</span><div><b>작은 つ(촉음)</b><p class="muted small">다음 소리의 자음을 한 박자 쉬듯 끊어 읽어요. 예) ${script === 'h' ? 'きって(우표), がっこう(학교)' : 'ベッド(침대), カップ(컵)'}</p></div></div>
          <div class="kn"><span class="k jp">${script === 'h' ? 'おう' : 'ー'}</span><div><b>장음</b><p class="muted small">${script === 'h' ? '모음을 한 박자 더 길게 읽어요. 예) おかあさん, せんせい, がっこう' : '가타카나는 ー로 길게 읽어요. 예) コーヒー, ノート, スーパー'}</p></div></div>
          <div class="kn"><span class="k jp">${script === 'h' ? 'ん' : 'ン'}</span><div><b>발음(ん)</b><p class="muted small">한 박자를 차지해요. 뒤 소리에 따라 ㄴ·ㅁ·ㅇ처럼 들려요. 예) ${script === 'h' ? 'しんぶん, てんき' : 'パン, ペン'}</p></div></div>
        </div>
        ${script === 'k' ? '<h3 class="kana-sub">외래어 표기</h3>' + grid(FOREIGN, 4) + '<p class="muted small">예) パーティー(파티), ファイル(파일)</p>' : '<p class="muted small">외래어 표기(ファ, ティ 등)는 가타카나 표에서 볼 수 있어요.</p>'}`;
    }
    return `${body}<button type="button" class="btn primary wide" data-kana="quiz">${script === 'h' ? '히라가나' : '가타카나'} 퀴즈 10문제</button>`;
  }

  /* ---------- 가나 퀴즈: 기본 + 탁음·반탁음에서 10글자, 로마자 4지선다 ---------- */
  function poolFor(sc) {
    const out = [];
    for (const rows of [BASIC, DAKU]) for (const r of rows) for (const c of r) if (c) out.push({ k: sc === 'h' ? c[0] : c[1], r: c[2] });
    return out;
  }
  function startQuiz() {
    const pool = poolFor(script);
    const romaji = [...new Set(pool.map((x) => x.r))];
    const items = A.shuffle(pool).slice(0, 10).map((x) => ({ k: x.k, r: x.r, opts: A.shuffle([x.r, ...A.shuffle(romaji.filter((r) => r !== x.r)).slice(0, 3)]) }));
    quiz = { items, i: 0, c: 0, picked: null, sc: script };
    render();
  }
  function vQuiz() {
    const it = quiz.items[quiz.i];
    if (!it) {
      return `<div class="panel center"><h3 class="kana-sub">${quiz.sc === 'h' ? '히라가나' : '가타카나'} 퀴즈 결과</h3><p class="score num">${quiz.c} / ${quiz.items.length}</p>${quiz.xp ? `<p class="xp-earned num">+${quiz.xp} XP</p>` : ''}
        <p class="muted small">${quiz.c === quiz.items.length ? '모두 맞혔어요!' : '틀린 글자는 표에서 한 번 더 눌러 들어 보세요.'}</p></div>
        <div class="stack"><button type="button" class="btn primary wide" data-kana="quiz">한 번 더</button><button type="button" class="btn ghost wide" data-kana="table">표로 돌아가기</button></div>`;
    }
    const answered = quiz.picked !== null;
    const opts = it.opts.map((o, k) => {
      let cls = 'opt', mark = '';
      if (answered) {
        if (o === it.r) { cls += ' right'; mark = '<span class="mark">○ 정답</span>'; }
        else if (k === quiz.picked) { cls += ' wrong'; mark = '<span class="mark">× 내 답</span>'; }
        else cls += ' dim';
      }
      return `<button type="button" class="${cls}" data-kana="ans" data-k="${k}" ${answered ? 'disabled' : ''}><span class="no">${k + 1}</span><span>${esc(o)}</span>${mark}</button>`;
    }).join('');
    return `<div class="sess-top"><span>가나 퀴즈</span><span class="num">${quiz.i + 1} / ${quiz.items.length}</span></div>
      <button type="button" class="kana-big jp" data-kana="say" data-say="${esc(it.k)}" aria-label="${esc(it.k)} 발음 듣기">${esc(it.k)}</button>
      <p class="prompt center">이 글자는 어떻게 읽나요?</p>
      <div class="opts">${opts}</div>
      ${answered ? `<button type="button" class="btn primary wide" data-kana="next">${quiz.i + 1 < quiz.items.length ? '다음' : '결과 보기'}</button>` : ''}
      <button type="button" class="btn ghost wide" data-kana="table">그만하고 표로</button>`;
  }

  function render() {
    const tabs = [['h', '히라가나'], ['k', '가타카나']].map(([k, l]) => `<button type="button" class="chip-btn${script === k ? ' on' : ''}" data-kana="script" data-v="${k}" aria-pressed="${script === k}">${script === k ? '● ' : ''}${l}</button>`).join('');
    const sets = Object.entries(SETS).map(([k, l]) => `<button type="button" class="chip-btn${set === k ? ' on' : ''}" data-kana="set" data-v="${k}" aria-pressed="${set === k}">${l}</button>`).join('');
    panel.innerHTML = `
      <div class="sheet-head"><h2 id="kana-title">가나 표</h2><button type="button" class="icon-btn" data-kana="close" aria-label="가나 표 닫기">×</button></div>
      <div class="seg two" role="group" aria-label="문자 종류">${tabs}</div>
      ${quiz ? vQuiz() : `<div class="seg four" role="group" aria-label="표 종류">${sets}</div><p class="muted small">글자를 누르면 천천히 두 번 읽어 줘요. 속도는 기록 탭에서 바꿀 수 있어요.</p>${vTable()}`}`;
  }

  function open() {
    if (root.classList.contains('open')) return;
    lastFocus = document.activeElement;
    render();
    root.classList.add('open');
    root.setAttribute('aria-hidden', 'false');
    const b = panel.querySelector('[data-kana="close"]'); if (b) b.focus();
  }
  function close() {
    if (!root.classList.contains('open')) return;
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }
  A.openKana = open;

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-kana]');
    if (!el || el.disabled) return;
    const act = el.dataset.kana;
    if (act === 'open') open();
    else if (act === 'close') close();
    else if (act === 'say') { if (A.speak) A.speak(el.dataset.say || ''); }
    else if (act === 'script') { script = el.dataset.v === 'k' ? 'k' : 'h'; quiz = null; render(); }
    else if (act === 'set') { if (SETS[el.dataset.v]) { set = el.dataset.v; render(); } }
    else if (act === 'quiz') startQuiz();
    else if (act === 'table') { quiz = null; render(); }
    else if (act === 'ans' && quiz && quiz.picked === null) {
      const it = quiz.items[quiz.i]; quiz.picked = Number(el.dataset.k);
      const ok = it.opts[quiz.picked] === it.r; if (ok) quiz.c++;
      if (A.feedback) A.feedback(ok);
      if (A.speak) A.speak(it.k);
      render();
    } else if (act === 'next' && quiz) {
      quiz.i++; quiz.picked = null;
      if (quiz.i >= quiz.items.length && !quiz.saved) {
        quiz.saved = true;
        quiz.xp = A.recordKana ? A.recordKana(quiz.sc, quiz.c, quiz.items.length) : 0;
        if (A.save) A.save();
        if (A.announce) A.announce();
      }
      render();
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && root.classList.contains('open')) { e.stopImmediatePropagation(); close(); } }, true);
})();

</script>
<script>
/* path.js */
/* 학습 경로: 단원 지도와 레슨(듀오링고처럼 짧은 연습 묶음).
   단원은 모두 열려 있고, 단원 안의 레슨은 앞 레슨을 마치면 열린다.
   레슨에서 틀린 문제는 끝에 한 번 더 나온다. 완료 기록은 S.path.done[레슨 id] = [날짜, 정확도]. */
(function () {
  'use strict';
  const A = window.App;
  const U = A.ui;
  if (!U) return;
  const esc = U.esc;
  const K = A.KANA || { BASIC: [], DAKU: [], YOON: [] };

  /* ---------- 경로 만들기 ---------- */
  const units = [];
  const lessonMap = new Map();
  function addUnit(id, name, icon, lessons) {
    if (!lessons.length) return;
    const u = { id, name, icon, lessons };
    lessons.forEach((l, k) => { l.unit = u; l.no = k + 1; lessonMap.set(l.id, l); });
    units.push(u);
  }
  const flat = (rows) => rows.flat().filter(Boolean);
  const KANA_SETS = [
    ['あ·か·さ행', 'ア·カ·サ행', () => K.BASIC.slice(0, 3)],
    ['た·な·は행', 'タ·ナ·ハ행', () => K.BASIC.slice(3, 6)],
    ['ま·や·ら·わ행', 'マ·ヤ·ラ·ワ행', () => K.BASIC.slice(6)],
    ['탁음·반탁음', '탁음·반탁음', () => K.DAKU],
    ['요음', '요음', () => K.YOON]
  ];
  const kanaLessons = (sc) => KANA_SETS.map(([nh, nk, f], k) => ({ id: `k${sc}${k + 1}`, kind: 'kana', sc, name: sc === 'h' ? nh : nk, cells: flat(f()) }));
  function wordLessons(topic) {
    const ids = A.WORDS.filter((w) => w.topic === topic).map((w) => w.id);
    const chunks = [];
    for (let i = 0; i < ids.length; i += 9) chunks.push(ids.slice(i, i + 9));
    if (chunks.length > 1 && chunks[chunks.length - 1].length < 4) { const last = chunks.pop(); chunks[chunks.length - 1] = chunks[chunks.length - 1].concat(last); }
    return chunks.map((c, k) => ({ id: `w-${topic}-${k + 1}`, kind: 'words', ids: c, name: `${A.TOPIC_NAME[topic]} ${k + 1}` }));
  }
  const grIds = A.QS.filter((q) => q.t === 'gr' && !q.mock).map((q) => q.id);
  const gramChunks = [];
  for (let i = 0; i < grIds.length; i += 6) gramChunks.push(grIds.slice(i, i + 6));
  if (gramChunks.length > 1 && gramChunks[gramChunks.length - 1].length < 3) { const last = gramChunks.pop(); gramChunks[gramChunks.length - 1] = gramChunks[gramChunks.length - 1].concat(last); }
  const gramLessons = (from, to) => gramChunks.slice(from, to).map((qids, k) => ({ id: `g-${from + k + 1}`, kind: 'gram', qids, name: `문법 ${from + k + 1}` }));
  const soIds = A.QS.filter((q) => q.t === 'so' && !q.mock).map((q) => q.id);
  const soLessons = [];
  for (let i = 0; i < soIds.length; i += 5) soLessons.push({ id: `s-${soLessons.length + 1}`, kind: 'so', qids: soIds.slice(i, i + 5), name: `문장 만들기 ${soLessons.length + 1}` });

  /* 독해·글의 문법·청해: 기존 문항을 레슨으로 묶는다 */
  /* 학습 경로는 회차 전용 문항을 쓰지 않는다(모의고사를 처음 볼 때 새 문제이도록) */
  const qOf = (t) => A.QS.filter((q) => q.t === t && !q.mock).map((q) => q.id).sort();
  function chunk(ids, n) {
    const out = [];
    for (let i = 0; i < ids.length; i += n) out.push(ids.slice(i, i + n));
    if (out.length > 1 && out[out.length - 1].length < Math.ceil(n / 2)) { const l = out.pop(); out[out.length - 1] = out[out.length - 1].concat(l); }
    return out;
  }
  const qsetLessons = (prefix, label, groups) => groups.map((qids, k) => ({ id: `${prefix}-${k + 1}`, kind: 'qset', qids, name: `${label} ${k + 1}` }));
  const bpGroups = [...new Set(A.QS.filter((q) => q.t === 'bp' && !q.mock).map((q) => q.g))].map((g) => A.QS.filter((q) => q.t === 'bp' && q.g === g).sort((a, b) => a.n - b.n).map((q) => q.id));
  const readGroups = chunk(qOf('rs'), 5).concat(chunk(qOf('rm'), 4), chunk(qOf('ri'), 5));
  const listenGroups = chunk(qOf('lt'), 7).concat(chunk(qOf('lp'), 6), chunk(qOf('le'), 5), chunk(qOf('lr'), 7));
  const ICON = { greet: 'こ', num: '一', time: '時', q: '何', people: '人', body: '体', food: '食', home: '家', place: '町', town: '駅', pos: '上', school: '学', nature: '空', shop: '買', hobby: '歌', kata: 'カ', verb: '行', adj: '高', adv: '少' };
  const wordUnit = (t) => addUnit('u-' + t, A.TOPIC_NAME[t], ICON[t] || '語', wordLessons(t));
  const gq = Math.ceil(gramChunks.length / 4);
  addUnit('u-hira', '히라가나', 'あ', kanaLessons('h'));
  addUnit('u-kata', '가타카나', 'ア', kanaLessons('k'));
  ['greet', 'num', 'time', 'q'].forEach(wordUnit);
  addUnit('u-g1', '문법 연습 ①', 'は', gramLessons(0, gq));
  ['people', 'body', 'food', 'home'].forEach(wordUnit);
  addUnit('u-g2', '문법 연습 ②', 'て', gramLessons(gq, gq * 2));
  addUnit('u-ls', '청해', '聞', qsetLessons('l', '청해', listenGroups));
  ['place', 'town', 'pos', 'school'].forEach(wordUnit);
  addUnit('u-g3', '문법 연습 ③', 'に', gramLessons(gq * 2, gq * 3));
  addUnit('u-bp', '글의 문법', '文', qsetLessons('b', '글의 문법', bpGroups));
  ['nature', 'shop', 'hobby', 'kata', 'verb'].forEach(wordUnit);
  addUnit('u-g4', '문법 연습 ④', 'も', gramLessons(gq * 3, gramChunks.length));
  addUnit('u-rd', '독해', '読', qsetLessons('r', '독해', readGroups));
  ['adj', 'adv'].forEach(wordUnit);
  addUnit('u-so', '문장 만들기', '★', soLessons);
  const ALL = units.flatMap((u) => u.lessons);
  A.PATH = { units, all: ALL };

  const done = () => A.S.path.done;
  const isDone = (l) => !!done()[l.id];
  const isOpen = (l) => l.no === 1 || isDone(l.unit.lessons[l.no - 2]);
  const nextLesson = () => ALL.find((l) => !isDone(l) && isOpen(l)) || null;

  /* ---------- 연습 만들기 ---------- */
  const toks = (m) => m.replace(/\(.*?\)/g, '').split(/[·,]/).map((s) => s.trim()).filter(Boolean);
  function wordOpts(w, field) {
    const own = new Set(toks(w.m));
    const ok = (x) => x.id !== w.id && x[field] !== w[field] && !toks(x.m).some((t) => own.has(t));
    let pool = A.WORDS.filter((x) => ok(x) && x.p === w.p && x.topic === w.topic);
    if (pool.length < 3) pool = A.WORDS.filter((x) => ok(x) && x.p === w.p);
    if (pool.length < 3) pool = A.WORDS.filter(ok);
    const seen = new Set([w[field]]); const out = [];
    for (const x of A.shuffle(pool)) { if (out.length >= 3) break; if (!seen.has(x[field])) { seen.add(x[field]); out.push(x[field]); } }
    return A.shuffle([w[field]].concat(out));
  }
  function wordItem(w, kind) {
    const rec = { t: 'w', id: w.id };
    const reading = w.r !== w.w ? `${w.r} · ` : '';
    if (kind === 'm') return { k: 'mcq', prompt: '이 단어의 뜻은?', big: w.w, bigJp: true, say: w.r, opts: wordOpts(w, 'm'), ans: w.m, rec, note: `${w.w} ${reading}${w.m}` };
    if (kind === 'j') return { k: 'mcq', prompt: '이 뜻의 일본어는?', big: w.m, optJp: true, opts: wordOpts(w, 'w'), ans: w.w, rec, note: `${w.w} ${reading}${w.m}` };
    if (kind === 'r') return { k: 'mcq', prompt: '읽는 법을 고르세요.', big: w.w, bigJp: true, optJp: true, opts: wordOpts(w, 'r'), ans: w.r, rec, note: `${w.w} → ${w.r} (${w.m})` };
    if (kind === 'l') return { k: 'mcq', listen: true, prompt: '듣고 알맞은 단어를 고르세요.', say: w.r, optJp: true, opts: wordOpts(w, 'w'), ans: w.w, rec, note: `${w.w} ${reading}${w.m}` };
    return { k: 'mcq', prompt: '빈칸에 들어갈 말을 고르세요.', big: w.ex.replace(w.w, '（　）'), bigJp: true, sub: w.exk, optJp: true, opts: wordOpts(w, 'w'), ans: w.w, rec, note: `${w.ex} — ${w.exk}` };
  }
  function buildWords(les) {
    const ws = les.ids.map((id) => A.WMAP.get(id)).filter(Boolean);
    const items = [{ k: 'intro', ids: ws.map((w) => w.id) }];
    const ex = [];
    ws.forEach((w, n) => {
      const kinds = ['m', 'j'];
      if (w.r !== w.w) kinds.push('r');
      if (U.canJa()) kinds.push('l');
      if (w.ex.includes(w.w)) kinds.push('b');
      ex.push(wordItem(w, kinds[n % kinds.length]));
    });
    const pairs = A.shuffle(ws).slice(0, 5).map((w) => [w.w, w.m, w.id]);
    if (pairs.length >= 3) ex.splice(Math.min(ex.length, 3), 0, matchItem(pairs, 'w'));
    if (ws.length >= 6) ex.push(matchItem(A.shuffle(ws).slice(0, 5).map((w) => [w.w, w.m, w.id]), 'w'));
    return items.concat(ex);
  }
  function matchItem(pairs, t) { return { k: 'match', pairs, t, order: A.shuffle(pairs.map((_, k) => k)), matched: new Set(), miss: new Set(), selL: null, selR: null }; }
  function buildKana(les) {
    const cells = les.cells;
    const ch = (c) => (les.sc === 'h' ? c[0] : c[1]);
    const romaCount = {}; cells.forEach((c) => { romaCount[c[2]] = (romaCount[c[2]] || 0) + 1; });
    const romaPool = [...new Set(cells.map((c) => c[2]).concat(flat(K.BASIC).map((c) => c[2])))];
    const charPool = cells.map(ch);
    const opts4 = (ans, pool) => A.shuffle([ans].concat(A.shuffle(pool.filter((x) => x !== ans)).slice(0, 3)));
    const pick = A.shuffle(cells).slice(0, 12);
    const ex = pick.map((c, n) => {
      const unique = romaCount[c[2]] === 1;
      const kinds = unique ? (U.canJa() ? ['kr', 'rk', 'kl'] : ['kr', 'rk']) : ['kr'];
      const kind = kinds[n % kinds.length];
      const rec = { t: 'k' };
      const note = `${ch(c)} = ${c[2]} (${c[3]})`;
      if (kind === 'kr') return { k: 'mcq', prompt: '이 글자는 어떻게 읽나요?', big: ch(c), bigJp: true, say: ch(c), opts: opts4(c[2], romaPool), ans: c[2], rec, note };
      if (kind === 'rk') return { k: 'mcq', prompt: '이 소리의 글자를 고르세요.', big: `${c[2]} · ${c[3]}`, optJp: true, opts: opts4(ch(c), charPool), ans: ch(c), rec, note };
      return { k: 'mcq', listen: true, prompt: '듣고 알맞은 글자를 고르세요.', say: ch(c), optJp: true, opts: opts4(ch(c), charPool), ans: ch(c), rec, note };
    });
    const mp = A.shuffle(cells.filter((c) => romaCount[c[2]] === 1)).slice(0, 5).map((c) => [ch(c), c[2], null]);
    if (mp.length >= 3) ex.splice(4, 0, matchItem(mp, 'k'));
    return [{ k: 'kintro', cells, sc: les.sc }].concat(ex);
  }
  function buildGram(les) {
    return les.qids.map((id) => A.QMAP.get(id)).filter(Boolean).map((q) => ({ k: 'mcq', prompt: A.QP[q.t] || '알맞은 것을 고르세요.', bigHtml: U.qText(q.q), bigJp: true, optJp: true, opts: A.shuffle(q.o), ans: q.o[0], rec: { t: 'q', id: q.id }, note: q.e }));
  }
  function buildSo(les) {
    return les.qids.map((id) => A.QMAP.get(id)).filter((q) => q && q.parts).map((q) => ({ k: 'so', qid: q.id, tiles: A.shuffle(q.parts), order: [], rec: { t: 'q', id: q.id }, note: q.e }));
  }
  function buildQset(les) {
    return les.qids.map((id) => A.QMAP.get(id)).filter(Boolean).map((q) => ({ k: 'q', qid: q.id, optJp: true, opts: A.shuffle(q.o), ans: q.o[0], rec: { t: 'q', id: q.id }, note: q.e }));
  }
  function buildItems(les) {
    if (les.kind === 'qset') return buildQset(les);
    if (les.kind === 'kana') return buildKana(les);
    if (les.kind === 'words') return buildWords(les);
    if (les.kind === 'gram') return buildGram(les);
    if (les.kind === 'so') return buildSo(les);
    return [];
  }
  const resetItem = (it) => {
    const c = Object.assign({}, it, { picked: null, done: false, ok: false, again: true, played: false, fx: false });
    if (c.k === 'match') Object.assign(c, { order: A.shuffle(c.pairs.map((_, k) => k)), matched: new Set(), miss: new Set(), selL: null, selR: null });
    if (c.k === 'so') Object.assign(c, { tiles: A.shuffle(c.tiles), order: [] });
    if (c.k === 'mcq' || c.k === 'q') c.opts = A.shuffle(c.opts);
    return c;
  };

  /* ---------- 레슨 진행 ---------- */
  let L = null;
  let focusId = null;
  function startLesson(id) {
    const les = lessonMap.get(id);
    if (!les) return;
    const items = buildItems(les);
    if (!items.length) { U.toast('레슨을 만들 수 없어요.'); return; }
    L = { id, les, items, i: 0, right: 0, tries: 0, xp: 0, combo: 0, t0: Date.now(), quitAsk: false, end: null };
    U.go('lesson');
    autoPlay();
  }
  const cur = () => (L && !L.end ? L.items[L.i] : null);
  function autoPlay() {
    const it = cur(); if (!it || it.played || !U.canJa()) return;
    if (it.k === 'q') { const q = A.QMAP.get(it.qid); if (q && A.LISTEN.has(q.t)) { it.played = true; U.playScript(q, it.opts); } }
    else if (it.listen) { it.played = true; A.speak(it.say); }
  }
  function record(it, ok) {
    let xp = 0;
    const r = it.rec;
    if (r && r.t === 'w') xp = A.answerTest(r.id, ok);
    else if (r && r.t === 'q') xp = A.answerQ(r.id, ok);
    else if (r && r.t === 'k' && ok) xp = A.addXP(1);
    L.tries++;
    if (ok) { L.right++; L.combo++; } else L.combo = 0;
    if (ok && L.combo > 0 && L.combo % 5 === 0) { xp += A.addXP(5); U.toast(`${L.combo}연속 정답! 보너스 +5 XP`); U.sfx('combo'); } else U.sfx(ok ? 'ok' : 'bad');
    it.xp = xp; L.xp += xp;
    U.buzz(ok ? 12 : [10, 60, 10]);
    if (!ok && !it.again) L.items.push(resetItem(it));
    U.commit();
  }
  function finish() {
    const acc = Math.round((L.right / Math.max(1, L.tries)) * 100);
    const prev = done()[L.id];
    const bonus = A.addXP(prev ? 5 : 10);
    L.xp += bonus;
    done()[L.id] = [A.ymd(), Math.max(acc, prev ? prev[1] : 0)];
    L.end = { acc, secs: Math.round((Date.now() - L.t0) / 1000), first: !prev, bonus };
    focusId = L.id;
    U.sfx('done');
    U.commit();
    U.render(false, 'fade');
  }

  /* ---------- 화면: 경로 ---------- */
  function nodeHtml(l, idx) {
    const d = isDone(l); const open = isOpen(l); const nx = nextLesson(); const here = nx && nx.id === l.id;
    const x = Math.round(Math.sin(idx * 0.95) * 64);
    const cls = 'node' + (d ? ' done' : '') + (here ? ' cur' : '') + (!open ? ' locked' : '');
    const label = d ? '★' : here ? '▶' : open ? String(l.no) : '·';
    const state = d ? `완료, 정확도 ${done()[l.id][1]}%` : here ? '지금 할 레슨' : open ? '열림' : '앞 레슨을 마치면 열려요';
    return `<div class="node-wrap" style="--x:${x}px">${here ? '<span class="n-bubble">시작</span>' : ''}<button type="button" class="${cls}" data-act="p-open" data-id="${l.id}" ${open ? '' : 'disabled'} aria-label="${esc(l.name)} · ${state}"><span>${label}</span></button><span class="n-lab small">${esc(l.name)}</span></div>`;
  }
  function vPath() {
    const total = ALL.length; const dn = ALL.filter(isDone).length;
    let idx = 0;
    const body = units.map((u, k) => {
      const ud = u.lessons.filter(isDone).length;
      const nodes = u.lessons.map((l) => nodeHtml(l, idx++)).join('');
      return `<section class="unit${ud === u.lessons.length ? ' complete' : ''}">
          <div class="unit-head"><span class="u-ico jp" aria-hidden="true">${esc(u.icon)}</span><div class="u-main"><b>${k + 1}단원 · ${esc(u.name)}</b><span class="small">${ud} / ${u.lessons.length} 레슨${ud === u.lessons.length ? ' · ✓ 완료' : ''}</span></div></div>
          <div class="nodes">${nodes}</div>
        </section>`;
    }).join('');
    return `<h1 class="title">학습 경로</h1>
      <p class="muted small">레슨 ${dn} / ${total}개를 마쳤어요. 단원은 어디서든 시작할 수 있고, 단원 안의 레슨은 차례대로 열려요.</p>
      <div class="path">${body}</div>`;
  }

  /* ---------- 화면: 레슨 ---------- */
  function optsHtml(it) {
    return it.opts.map((o, k) => {
      let cls = 'opt', mark = '';
      if (it.done) {
        if (o === it.ans) { cls += ' right' + (it.fx && it.ok ? ' pop' : ''); mark = '<span class="mark">○ 정답</span>'; }
        else if (k === it.picked) { cls += ' wrong' + (it.fx ? ' shake' : ''); mark = '<span class="mark">× 내 답</span>'; }
        else cls += ' dim';
      } else if (k === it.picked) { cls += ' picked'; mark = '<span class="mark">선택</span>'; }
      const label = it.k === 'q' && U.hideOpt(A.QMAP.get(it.qid), it.done) ? '<span class="muted">소리로 듣는 보기</span>' : esc(o);
      return `<button type="button" class="${cls}" data-act="p-pick" data-k="${k}" ${it.done ? 'disabled' : ''}><span class="no">${k + 1}</span><span class="${it.optJp ? 'jp' : ''}">${label}</span>${mark}</button>`;
    }).join('');
  }
  function bodyHtml(it) {
    if (it.k === 'intro') {
      const rows = it.ids.map((id) => { const w = A.WMAP.get(id); return `<li><div class="li-main"><span class="jp big-w">${esc(w.w)}</span>${w.r !== w.w ? ` <span class="muted jp">${esc(w.r)}</span>` : ''}<br><span class="small">${esc(w.m)}</span></div>${U.canJa() ? `<button type="button" class="say" data-act="speak" data-say="${esc(w.r)}" aria-label="${esc(w.w)} 발음 듣기">▶</button>` : ''}</li>`; }).join('');
      return `<p class="ls-prompt">새 단어 ${it.ids.length}개</p><p class="muted small">한 번 읽어 보고 ▶로 소리도 들어 보세요. 바로 연습이 이어져요.</p><section class="panel"><ul class="notes">${rows}</ul></section>`;
    }
    if (it.k === 'kintro') {
      const cells = it.cells.map((c) => { const k = it.sc === 'h' ? c[0] : c[1]; return `<button type="button" class="kcell" data-kana="say" data-say="${esc(k)}" aria-label="${esc(k)} 발음 듣기"><span class="k">${esc(k)}</span><span class="r">${esc(c[2])} · ${esc(c[3])}</span></button>`; }).join('');
      return `<p class="ls-prompt">이번에 배울 글자</p><p class="muted small">글자를 눌러 소리를 들어 보세요.</p><div class="kana-grid c${it.cells[0] && it.cells[0][0].length > 1 ? 3 : 5}">${cells}</div>`;
    }
    if (it.k === 'match') {
      const left = it.pairs.map((p, k) => `<button type="button" class="mt jp${it.matched.has(k) ? ' gone' : ''}${it.selL === k ? ' sel' : ''}${it.badL === k ? ' bad' : ''}" data-act="p-ml" data-k="${k}" ${it.matched.has(k) ? 'disabled' : ''}>${it.matched.has(k) ? '✓ ' : ''}${esc(p[0])}</button>`).join('');
      const right = it.order.map((pi) => `<button type="button" class="mt${it.matched.has(pi) ? ' gone' : ''}${it.selR === pi ? ' sel' : ''}${it.badR === pi ? ' bad' : ''}" data-act="p-mr" data-k="${pi}" ${it.matched.has(pi) ? 'disabled' : ''}>${it.matched.has(pi) ? '✓ ' : ''}${esc(it.pairs[pi][1])}</button>`).join('');
      return `<p class="ls-prompt">짝을 맞춰 보세요</p><div class="match"><div class="mcol">${left}</div><div class="mcol">${right}</div></div>`;
    }
    if (it.k === 'q') {
      const q = A.QMAP.get(it.qid);
      let head;
      if (A.LISTEN.has(q.t)) {
        const can = U.canJa();
        head = `<p class="prompt">${esc(A.QP[q.t])}</p>${q.t === 'le' ? `<p class="sit">${esc(q.sit)}</p>` : ''}` +
          (can ? '<div class="listen"><button type="button" class="btn primary" id="l-play" data-act="p-lplay">▶ 듣기</button></div>' : '<p class="muted small">이 기기에는 일본어 음성이 없어서 대본을 글로 보여 드려요.</p>') +
          (q.t === 'lt' || q.t === 'lp' ? `<p class="rq jp"><b>${esc(q.ask)}</b></p>` : '') +
          (!can || it.done ? U.scriptHtml(q, !can) : '');
      } else head = U.qBlock(q, it.done);
      return `${head}<div class="opts">${optsHtml(it)}</div>`;
    }
    if (it.k === 'so') {
      const q = A.QMAP.get(it.qid);
      const slots = [0, 1, 2, 3].map((k) => {
        const ti = it.order[k]; const has = ti !== undefined;
        let cls = 'slot' + (k === q.star ? ' star' : '') + (has ? ' has' : '');
        let mark = '';
        if (it.done) { const ok = has && it.tiles[ti] === q.parts[k]; cls += ok ? ' right' : ' wrong'; mark = `<span class="mark">${ok ? '○' : '×'}</span>`; }
        return `<button type="button" class="${cls}" data-act="p-slot" data-k="${k}" ${it.done || !has ? 'disabled' : ''}>${k === q.star && has ? '<span class="st">★</span>' : ''}<span class="jp">${has ? esc(it.tiles[ti]) : k === q.star ? '★' : '　'}</span>${mark}</button>`;
      }).join('');
      const bank = it.tiles.map((t, k) => (it.order.includes(k) ? `<span class="tile ghost" aria-hidden="true">${esc(t)}</span>` : `<button type="button" class="tile jp" data-act="p-tile" data-k="${k}" ${it.done ? 'disabled' : ''}>${esc(t)}</button>`)).join('');
      return `<p class="ls-prompt">말을 순서대로 놓아 문장을 만드세요</p><div class="so-line jp"><span>${esc(q.pre)}</span>${slots}<span>${esc(q.post)}</span></div><div class="tiles-bank">${bank}</div>`;
    }
    const top = it.listen && U.canJa()
      ? '<button type="button" class="listen-big" data-act="p-say" aria-label="다시 듣기">▶<span class="small">다시 듣기</span></button>'
      : it.bigHtml ? `<div class="ls-big small-text jp">${it.bigHtml}</div>` : it.big ? `<div class="ls-big${it.bigJp ? ' jp' : ''}${it.big.length > 8 ? ' small-text' : ''}">${esc(it.big)}</div>` : '';
    const say = !it.listen && it.say && U.canJa() ? '<div class="center"><button type="button" class="say" data-act="p-say">▶ 발음</button></div>' : '';
    return `<p class="ls-prompt">${esc(it.prompt)}</p>${top}${it.sub ? `<p class="muted small center">${esc(it.sub)}</p>` : ''}${say}<div class="opts">${optsHtml(it)}</div>`;
  }
  function answerText(it) {
    if (it.k === 'so') { const q = A.QMAP.get(it.qid); return `${q.pre} ${q.parts.join(' ')} ${q.post}`; }
    return it.ans || '';
  }
  function footHtml(it) {
    if (it.k === 'intro' || it.k === 'kintro') return '<div class="ls-foot"><button type="button" class="btn primary wide" data-act="p-next">연습 시작</button></div>';
    if (!it.done) {
      if (it.k === 'match') return '<div class="ls-foot"><p class="muted small center">왼쪽과 오른쪽에서 하나씩 눌러 짝을 지어요.</p></div>';
      if (it.k === 'so') return `<div class="ls-foot row2"><button type="button" class="btn" data-act="p-clear" ${it.order.length ? '' : 'disabled'}>다시 놓기</button><button type="button" class="btn primary" data-act="p-check" ${it.order.length === 4 ? '' : 'disabled'}>확인</button></div>`;
      return `<div class="ls-foot"><button type="button" class="btn primary wide" data-act="p-check" ${it.picked === null || it.picked === undefined ? 'disabled' : ''}>확인</button></div>`;
    }
    const ok = it.ok;
    return `<div class="ls-fb ${ok ? 'ok' : 'bad'}" role="status">
        <b class="fb-t">${ok ? '○ 정답이에요!' : '× 아쉬워요'}${it.xp ? `<span class="xp-pop num">+${it.xp} XP</span>` : ''}</b>
        ${!ok && it.k !== 'match' ? `<p>정답: <b class="jp">${esc(answerText(it))}</b></p>` : ''}
        ${it.note ? `<p class="small">${esc(it.note)}</p>` : ''}
        ${it.k === 'q' ? U.trHtml(A.QMAP.get(it.qid)) : ''}
        ${!ok && !it.again ? '<p class="muted small">이 문제는 레슨 끝에 한 번 더 나와요.</p>' : ''}
        <button type="button" class="btn primary wide" data-act="p-next">계속</button>
      </div>`;
  }
  function vLesson() {
    if (!L) return vPath();
    if (L.end) {
      const e = L.end; const m = Math.floor(e.secs / 60), s = e.secs % 60;
      return `<section class="panel center lesson-end">
          <div class="done-mark" aria-hidden="true">★</div>
          <h2>레슨 완료!</h2>
          <p class="muted">${esc(L.les.unit.name)} · ${esc(L.les.name)}</p>
          <div class="tiles">
            <div class="tile"><span class="muted small">받은 XP</span><b class="num">+${L.xp}</b></div>
            <div class="tile"><span class="muted small">정확도</span><b class="num">${e.acc}%</b></div>
            <div class="tile"><span class="muted small">걸린 시간</span><b class="num">${m}분 ${s}초</b></div>
            <div class="tile"><span class="muted small">완료 보너스</span><b class="num">+${e.bonus} XP</b></div>
          </div>
          <div class="stack">${nextLesson() ? '<button type="button" class="btn primary wide" data-act="p-start-next">다음 레슨</button>' : ''}<button type="button" class="btn wide" data-act="p-path">경로로</button></div>
        </section>`;
    }
    const it = L.items[L.i];
    const doneN = L.i + (it.done || it.k === 'intro' || it.k === 'kintro' ? 1 : 0);
    const top = `<div class="ls-top"><button type="button" class="icon-btn" data-act="p-quit" aria-label="레슨 그만하기">×</button><div class="track ls-track"><i style="width:${U.pct(doneN, L.items.length)}%"></i></div>${L.combo >= 2 ? `<span class="combo num">콤보 ${L.combo}</span>` : ''}</div>`;
    if (L.quitAsk) return `${top}<div class="confirm"><p>레슨을 그만할까요? 지금까지 푼 기록은 남지만 레슨은 완료되지 않아요.</p><div class="row2"><button type="button" class="btn" data-act="p-quit-no">계속하기</button><button type="button" class="btn danger" data-act="p-quit-yes">그만하기</button></div></div>`;
    const html = `${top}<div class="ls-body">${bodyHtml(it)}</div>${footHtml(it)}`;
    it.fx = false; /* 정답 효과는 처음 한 번만 */
    return html;
  }

  /* ---------- 홈 카드 ---------- */
  U.homeExtra = () => {
    const nx = nextLesson(); const dn = ALL.filter(isDone).length;
    return `<section class="panel path-card">
        <div class="panel-head"><h2>학습 경로</h2><span class="chip num">${dn} / ${ALL.length}</span></div>
        <p class="small">${nx ? `다음 레슨 · <b>${esc(nx.unit.name)}</b> ${esc(nx.name)}` : '모든 레슨을 마쳤어요!'}</p>
        <div class="track"><i style="width:${U.pct(dn, ALL.length)}%"></i></div>
        <div class="row2"><button type="button" class="btn primary" data-act="p-start-next" ${nx ? '' : 'disabled'}>${dn ? '이어서 레슨' : '첫 레슨 시작'}</button><button type="button" class="btn" data-act="p-path">경로 보기</button></div>
      </section>`;
  };

  /* ---------- 입력 ---------- */
  function rerender() { U.render(true); }
  U.addView('path', vPath, 'home');
  U.addView('lesson', vLesson, 'home');
  U.addHandlers({
    'p-path': () => { L = null; U.go('path'); const el = document.querySelector(focusId ? `.node[data-id="${focusId}"]` : '.node.cur') || document.querySelector('.node.cur'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); focusId = null; },
    'p-start-next': () => { const nx = nextLesson(); if (nx) startLesson(nx.id); },
    'p-open': (el) => { const l = lessonMap.get(el.dataset.id); if (l && isOpen(l)) startLesson(l.id); },
    'p-lplay': () => { const it = cur(); if (!it || it.k !== 'q') return; if (U.isPlaying()) U.stopAudio(); else U.playScript(A.QMAP.get(it.qid), it.opts); },
    'p-say': () => { const it = cur(); if (it && it.say) A.speak(it.say); },
    'p-pick': (el) => { const it = cur(); if (!it || it.done || (it.k !== 'mcq' && it.k !== 'q')) return; it.picked = Number(el.dataset.k); rerender(); },
    'p-check': () => {
      const it = cur(); if (!it || it.done) return;
      let ok;
      if (it.k === 'so') { if (it.order.length !== 4) return; const q = A.QMAP.get(it.qid); ok = it.order.every((ti, k) => it.tiles[ti] === q.parts[k]); }
      else { if (it.picked === null || it.picked === undefined) return; ok = it.opts[it.picked] === it.ans; }
      it.done = true; it.ok = ok; it.fx = true;
      record(it, ok);
      if (it.say && !it.listen && U.canJa() && L.les.kind !== 'gram') A.speak(it.say);
      rerender();
    },
    'p-next': () => {
      if (!L || L.end) return;
      const it = cur();
      if (it && !(it.done || it.k === 'intro' || it.k === 'kintro')) return;
      if (U.isPlaying()) U.stopAudio();
      if (L.i + 1 >= L.items.length) { finish(); return; }
      L.i++;
      U.render(false, 'next');
      autoPlay();
    },
    'p-quit': () => { if (L) { L.quitAsk = true; rerender(); } },
    'p-quit-no': () => { if (L) { L.quitAsk = false; rerender(); } },
    'p-quit-yes': () => { L = null; U.go('path'); },
    'p-ml': (el) => matchTap(el, 'L'),
    'p-mr': (el) => matchTap(el, 'R'),
    'p-tile': (el) => { const it = cur(); if (!it || it.k !== 'so' || it.done || it.order.length >= 4) return; const k = Number(el.dataset.k); if (!it.order.includes(k)) { it.order.push(k); U.sfx('card'); rerender(); } },
    'p-slot': (el) => { const it = cur(); if (!it || it.k !== 'so' || it.done) return; const k = Number(el.dataset.k); if (k < it.order.length) { it.order.splice(k, 1); rerender(); } },
    'p-clear': () => { const it = cur(); if (!it || it.k !== 'so' || it.done) return; it.order = []; rerender(); }
  });
  function matchTap(el, side) {
    const it = cur(); if (!it || it.k !== 'match' || it.done) return;
    const k = Number(el.dataset.k);
    if (it.matched.has(k)) return;
    if (side === 'L') { it.selL = k; if (it.t === 'w' && U.canJa()) { const w = A.WMAP.get(it.pairs[k][2]); if (w) A.speak(w.r); } else if (it.t === 'k' && U.canJa()) A.speak(it.pairs[k][0]); }
    else it.selR = k;
    if (it.selL !== null && it.selR !== null) {
      if (it.selL === it.selR) { it.matched.add(it.selL); U.sfx('ok'); }
      else { it.miss.add(it.selL); it.badL = it.selL; it.badR = it.selR; U.sfx('bad'); U.buzz([10, 60, 10]); setTimeout(() => { it.badL = it.badR = undefined; if (cur() === it) rerender(); }, 450); }
      it.selL = it.selR = null;
    }
    if (it.matched.size === it.pairs.length) {
      it.done = true; it.ok = true; it.fx = true;
      if (it.t === 'w') { let xp = 0; it.pairs.forEach(([, , id], pi) => { xp += A.answerTest(id, !it.miss.has(pi)); }); it.xp = xp; L.xp += xp; }
      else { it.xp = A.addXP(2); L.xp += it.xp; }
      L.tries++; L.right++; U.sfx('combo'); U.commit();
      it.note = it.miss.size ? `틀린 짝 ${it.miss.size}개는 오답노트에 들어갔어요.` : '모두 한 번에 맞혔어요!';
    }
    rerender();
  }
  if (U.view() === 'home') U.render(true);
})();

</script>
